<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2b3a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CValRSketch">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="../icon.svg">
<link rel="apple-touch-icon" href="../icon-192.png">
<title>CValRSketch — Mobile</title>
<script src="../core.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font: 14px/1.3 -apple-system, "Segoe UI", system-ui, sans-serif;
    color: #222;
    background: #f0f0f0;
    display: flex; flex-direction: column;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  /* Header */
  header {
    background: #2b3a4a; color: #fff;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    flex: 0 0 auto;
  }
  header .title { flex: 1; font-size: 14px; font-weight: bold; display: flex; align-items: baseline; gap: 6px; }
  header .ver { font-size: 11px; font-weight: normal; color: rgba(255,255,255,0.65); }
  header button {
    background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.3);
    border-radius: 6px; padding: 6px 10px; font-size: 16px; min-width: 44px; min-height: 36px;
  }
  /* Canvas wrap */
  .canvas-wrap { flex: 1 1 auto; position: relative; background: #fff; min-height: 0; }
  svg { width: 100%; height: 100%; display: block; touch-action: none; }
  .visible-wall { stroke: #000; stroke-width: 2; fill: none; }
  .visible-wall.selected { stroke: #2b6cb0; stroke-width: 4; }
  .ghost { opacity: var(--ghost-opacity, 0.45); }
  .vertex-dot { fill: #fff; stroke: #444; stroke-width: 1.5; }
  .vertex-dot.selected { fill: #2b6cb0; stroke: #fff; }
  .vertex-pickable { fill: #d4edda; stroke: #2e8b57; stroke-width: 2; }
  .vertex-pickable.is-start { fill: #2e8b57; stroke: #fff; }
  /* Status line */
  .status {
    flex: 0 0 auto;
    background: #f7f7f9; color: #444;
    padding: 4px 12px; font-size: 12px; font-family: ui-monospace, monospace;
    border-top: 1px solid #d0d8e0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .status.gap { color: #c44; font-weight: bold; }
  .status.closed { color: #2e8b57; }
  /* Bottom controls */
  .controls {
    flex: 0 0 auto;
    background: #fafafa;
    border-top: 1px solid #ccc;
    overflow: hidden;
    transition: max-height 0.18s ease-out;
    max-height: 70vh;
  }
  .controls.collapsed { max-height: 0; border-top-width: 0; }
  /* Floating "expand" button shown only when controls are collapsed */
  .fab-expand {
    position: absolute; right: 12px; bottom: 12px;
    z-index: 50;
    background: #2b3a4a; color: #fff;
    border: none; border-radius: 24px;
    padding: 10px 16px; font-size: 14px; font-weight: bold;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    display: none;
  }
  body.collapsed .fab-expand { display: block; }
  /* In-row collapse button */
  .entry .toggle-btn {
    background: transparent; border: 1px solid #ddd; border-radius: 6px;
    width: 36px; height: 32px; font-size: 14px; color: #888; padding: 0;
  }
  /* Fence mode swaps the keypad for a small panel */
  .fence-panel { display: none; padding: 10px 12px; background: #fff4e6; border-top: 2px solid #e57c00; }
  .controls.fence-active .entry,
  .controls.fence-active .keypad { display: none; }
  .controls.fence-active .fence-panel { display: flex; flex-direction: column; gap: 8px; }
  .fence-panel .status { font-size: 12px; color: #6b3410; font-family: ui-monospace, monospace; }
  .fence-panel input[type="text"] {
    width: 100%; padding: 10px; font-size: 16px;
    border: 1px solid #c79a6a; border-radius: 8px; background: #fff;
  }
  .fence-panel .row { display: flex; gap: 6px; }
  .fence-panel .row button { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #c79a6a; background: #fff; font-size: 13px; font-weight: bold; }
  .fence-panel .row button.primary { background: #e57c00; color: #fff; border-color: #c66a00; }
  .fence-panel .row button.danger  { background: #f8d7da; color: #721c24; border-color: #f5c6cb; }
  body.fence-active header { background: #c66a00; }
  /* Entry display — shows the segment expression as the user builds it */
  .entry {
    background: #fff; padding: 8px 12px;
    border-top: 1px solid #ddd; border-bottom: 1px solid #ddd;
    display: flex; align-items: center; gap: 8px;
    font-family: ui-monospace, monospace;
    min-height: 40px;
  }
  .entry .label { color: #888; font-size: 11px; text-transform: uppercase; }
  .entry .value { flex: 1; font-size: 18px; font-weight: bold; color: #2b3a4a; }
  .entry .value.placeholder { color: #aaa; font-weight: normal; font-size: 13px; }
  .entry .preview { color: #2e8b57; font-size: 11px; }
  /* Keypad */
  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    padding: 6px;
  }
  .keypad button {
    background: #fff; border: 1px solid #ccc; border-radius: 8px;
    font-size: 19px; font-weight: bold; color: #222;
    min-height: 48px;
    transition: background 0.08s;
    -webkit-touch-callout: none;
  }
  .keypad button.unit { background: #f4f0e6; font-size: 15px; }
  .keypad button.dir  { background: #e8f0fa; color: #2b3a4a; font-size: 17px; }
  .keypad button.dir:active { background: #2b6cb0; color: #fff; }
  .keypad button.back { background: #f8d7da; color: #721c24; font-size: 22px; }
  .keypad button.add  { background: #2e8b57; color: #fff; border-color: #1d6a3e; font-size: 17px; grid-column: span 4; min-height: 52px; }
  .keypad button.add.disabled { background: #b9c7b8; border-color: #b9c7b8; color: #f0f0f0; }
  .keypad button:active { transform: scale(0.96); }
  /* Drawer */
  .drawer-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100; display: none;
  }
  .drawer-bg.open { display: block; }
  .drawer {
    position: fixed; left: 0; top: 0; bottom: 0;
    width: 86%; max-width: 320px;
    background: #fff;
    transform: translateX(-100%);
    transition: transform 0.2s ease-out;
    z-index: 101;
    overflow-y: auto;
    padding: 12px;
    padding-top: calc(env(safe-area-inset-top) + 12px);
    padding-bottom: calc(env(safe-area-inset-bottom) + 12px);
    display: flex; flex-direction: column; gap: 10px;
  }
  .drawer.open { transform: translateX(0); }
  .drawer h2 { font-size: 13px; color: #666; text-transform: uppercase; margin: 12px 0 4px; }
  .drawer .row { display: flex; gap: 6px; align-items: center; }
  .drawer button {
    padding: 10px 12px; border: 1px solid #ccc; background: #fff; border-radius: 8px;
    font-size: 14px; min-height: 44px;
    text-align: left;
  }
  .drawer button.primary { background: #2b6cb0; color: #fff; border-color: #1b4a7a; }
  .drawer button.danger  { background: #f8d7da; color: #721c24; border-color: #f5c6cb; }
  .drawer input[type="text"] {
    flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px;
  }
  .drawer .floor-tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  .drawer .floor-tabs button {
    padding: 8px 12px; min-height: 36px; font-size: 13px;
  }
  .drawer .floor-tabs button.active { background: #2b6cb0; color: #fff; }
  .drawer .shape-list { display: flex; flex-direction: column; gap: 4px; }
  .drawer .shape-list .item {
    padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px;
    display: flex; justify-content: space-between; font-size: 13px;
  }
  /* Modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200;
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: #fff; border-radius: 12px; padding: 16px;
    max-width: 360px; width: 100%;
    display: flex; flex-direction: column; gap: 8px;
  }
  .modal h3 { margin: 0 0 8px; font-size: 15px; }
  .modal .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .modal button {
    padding: 10px 16px; border: 1px solid #ccc; background: #fff; border-radius: 8px;
    font-size: 14px; min-height: 44px;
  }
  .modal button.primary { background: #2b6cb0; color: #fff; border-color: #1b4a7a; }
  .modal button.danger  { background: #f8d7da; color: #721c24; border-color: #f5c6cb; }
  /* Toast */
  .toast {
    position: fixed; bottom: calc(env(safe-area-inset-bottom) + 16px); left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85); color: #fff;
    padding: 10px 16px; border-radius: 8px;
    font-size: 13px; z-index: 300;
    pointer-events: none;
    opacity: 0; transition: opacity 0.2s;
    max-width: 80%;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <button id="btn-menu" aria-label="Menu">☰</button>
  <div class="title" id="title-text"><span>CValRSketch</span><span class="ver" id="header-version"></span></div>
  <button id="btn-undo" aria-label="Undo">↶</button>
  <button id="btn-fence-toggle" aria-label="Group select / fence">🔲</button>
  <button id="btn-close-shape" aria-label="Close Shape">✓</button>
</header>

<div class="canvas-wrap">
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
  <button class="fab-expand" id="btn-expand" aria-label="Show keypad">▲ Show keypad</button>
</div>

<div class="status" id="status">Pen at start. Pick a direction and a distance.</div>

<div class="controls" id="controls">
  <div class="entry">
    <span class="label">ENTRY</span>
    <span class="value placeholder" id="entry-value">type length, then direction</span>
    <span class="preview" id="entry-preview"></span>
    <button class="toggle-btn" id="btn-collapse" aria-label="Hide keypad">▼</button>
  </div>
  <div class="keypad" id="keypad">
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="back" class="back" aria-label="backspace">⌫</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="ft" class="unit">ft</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="in" class="unit">in</button>
    <button data-k="0">0</button><button data-k="." aria-label="decimal"><span style="font-size:24px;line-height:1;">·</span></button><button data-k="+" class="unit">+</button><button data-k="clear" class="back" aria-label="clear entry">×</button>
    <button data-k="l" class="dir">L</button><button data-k="u" class="dir">U</button><button data-k="d" class="dir">D</button><button data-k="r" class="dir">R</button>
    <button data-k="add" id="btn-add" class="add">✓ Add Wall</button>
  </div>
  <div class="fence-panel">
    <div class="status" id="fence-status">Drag on the canvas to select vertices inside a rectangle.</div>
    <input type="text" id="fence-move-input" placeholder="Move selected by, e.g. 3'6 r">
    <div class="row">
      <button id="fence-move-btn" class="primary">↔ Move</button>
      <button id="fence-clear-btn">Clear</button>
      <button id="fence-done-btn" class="danger">Done</button>
    </div>
  </div>
</div>

<div class="drawer-bg" id="drawer-bg"></div>
<aside class="drawer" id="drawer">
  <h2>Subject</h2>
  <input type="text" id="subject-input" placeholder="e.g. 113 7th Ave, Nakusp">

  <h2>Floor</h2>
  <div class="floor-tabs" id="floor-tabs"></div>
  <div class="row">
    <button id="btn-add-floor" style="flex:1;">+ Add Floor</button>
    <button id="btn-rename-floor" style="flex:1;">Rename</button>
  </div>

  <h2>Areas on this Floor</h2>
  <div class="shape-list" id="shape-list"></div>

  <h2>Start Point</h2>
  <div style="font-size:12px; color:#666;" id="drawer-start-info"></div>
  <div class="row">
    <input type="text" id="start-offset-input" placeholder="offset, e.g. 3'6 r">
    <button id="btn-offset-start">Offset</button>
  </div>
  <button id="btn-reset-start">Reset start to origin</button>

  <h2>Actions</h2>
  <button id="btn-cancel-walk" class="danger">Cancel current walk</button>
  <button id="btn-save-json">💾 Save sketch (JSON)</button>
  <button id="btn-load-json">📂 Load sketch (JSON)</button>
  <input type="file" id="file-input" accept=".json" style="display:none">
  <button id="btn-export-png" class="primary">📷 Export PNG</button>
  <button id="btn-export-svg">📷 Export SVG</button>
  <button id="btn-fence-mode">🔲 Group select / move…</button>

  <h2>Display</h2>
  <label style="display:flex; align-items:center; gap:8px; padding: 4px 0;">
    <span style="flex:1; font-size:13px;">Other floors opacity</span>
    <input type="range" id="ghost-slider" min="0.05" max="1" step="0.05" style="width:120px;">
    <span id="ghost-val" style="font-family:ui-monospace,monospace; min-width:34px; text-align:right; font-size:12px;"></span>
  </label>

  <h2>About</h2>
  <p style="font-size:12px; color:#666; margin:4px 0;">
    CValRSketch — mobile<br>
    <span id="drawer-version" style="font-family:ui-monospace,monospace; font-weight:bold; color:#222;"></span><br>
    <a href="../" style="color:#2b6cb0;">Open desktop version</a><br>
    <a href="https://github.com/CAA-EBV-CO-OP/CValRSketch" style="color:#2b6cb0;">Source on GitHub</a>
  </p>
  <button id="btn-force-reload" class="primary">↻ Reload latest (clear cache)</button>
</aside>

<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// =============================================================================
// CValRSketch — Mobile UI
// Uses ../core.js for parsing, geometry, and shape-edit ops.
// =============================================================================

const APP_VERSION = '0.11.10'; // bump on every mobile release; surfaced in header + drawer
const $ = (id) => document.getElementById(id);
const svg = $('canvas');

// ----- State (compatible shape with desktop's state.json) -----
let state = {
  segments: [],
  shapes: [],
  floors: ['basement', 'main', 'upper'],
  activeFloor: 'main',
  selection: null,
  mode: 'walk',
  nextShapeId: 1,
  startPoint: null,
  undoStack: [],
  redoStack: [],
  annotations: [],
  subject: '',
  subtitle: '',
  settings: { ...SETTINGS_DEFAULTS },
};

// ----- Walk-input state (mobile-specific) -----
// Single text buffer the user builds via the keypad. Mirrors the desktop's typed
// segment box. parseSegment handles everything: cardinal walls, diagonals via
// chained `<len><dir><len><dir>` (rise/run), and angles like `r 45`.
let entryText = '';

// Auto-extend preview: when the user taps a direction with no length in the
// entry, we don't commit immediately — we preview the snap point. Tapping the
// SAME direction button again cycles through further-out aligned vertices.
// Tap ✓ Add Wall to commit the current candidate; tap × or ⌫ to cancel.
let autoExtendPreview = null;  // null | { dir, candIdx, candidates: [...] }

// Fence (group select / stretch) mode — toggled from drawer.
let fenceMode = false;
let fenceDraw = null;          // { start: {x,y}, end: {x,y} } in WORLD coords (during one-finger drag)
let fenceSelection = null;     // { shapeVerts: [{shapeId,idx}], inProgVerts: [idx] }

// ----- View transform (screen ↔ world) -----
let view = { tx: 0, ty: 0, scale: 1 };
let userView = null;        // overrides fit when set (after pinch/pan)

// ----- localStorage settings -----
try {
  const saved = JSON.parse(localStorage.getItem('cvalrsketchMobileSettings') || '{}');
  Object.assign(state.settings, saved);
} catch (e) {}
function saveSettings() {
  localStorage.setItem('cvalrsketchMobileSettings', JSON.stringify(state.settings));
}

// =============================================================================
// SAVE / LOAD / UNDO
// =============================================================================
function snapshotState() {
  return JSON.stringify({
    segments: state.segments,
    shapes: state.shapes,
    floors: state.floors,
    activeFloor: state.activeFloor,
    nextShapeId: state.nextShapeId,
    startPoint: state.startPoint,
    annotations: state.annotations,
  });
}
function restoreState(snap) {
  const d = JSON.parse(snap);
  state.segments = d.segments || [];
  state.shapes = d.shapes || [];
  state.floors = d.floors || ['basement','main','upper'];
  state.activeFloor = d.activeFloor || 'main';
  state.nextShapeId = d.nextShapeId || 1;
  state.startPoint = d.startPoint || null;
  state.annotations = d.annotations || [];
  state.selection = null;
}
function pushUndo() {
  state.undoStack.push(snapshotState());
  if (state.undoStack.length > HISTORY_LIMIT) state.undoStack.shift();
  state.redoStack.length = 0;
}
function undoHistory() {
  if (!state.undoStack.length) return;
  state.redoStack.push(snapshotState());
  restoreState(state.undoStack.pop());
  render();
}

function getStart() { return state.startPoint || { x: 0, y: 0 }; }
function shapesOnFloor(f) { return state.shapes.filter(s => s.floor === f); }
function shapesOnOtherFloors() { return state.shapes.filter(s => s.floor !== state.activeFloor); }

// =============================================================================
// RENDER
// =============================================================================
function addEl(tag, attrs, text) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (text !== undefined) el.textContent = text;
  svg.appendChild(el);
  return el;
}

function fitView() {
  const w = svg.clientWidth || 360, h = svg.clientHeight || 400;
  const pts = [];
  for (const sh of state.shapes) if (sh.floor === state.activeFloor) pts.push(...sh.points);
  if (state.segments.length) pts.push(...pathPoints(state.segments, getStart()));
  for (const sh of state.shapes) if (sh.floor !== state.activeFloor) pts.push(...sh.points);
  if (!pts.length) pts.push({x:0,y:0}, {x:10,y:10});
  const minX = Math.min(...pts.map(p => p.x));
  const maxX = Math.max(...pts.map(p => p.x));
  const minY = Math.min(...pts.map(p => p.y));
  const maxY = Math.max(...pts.map(p => p.y));
  const pad = 40;
  const sx = (w - pad*2) / Math.max(0.001, maxX - minX);
  const sy = (h - pad*2) / Math.max(0.001, maxY - minY);
  const scale = Math.min(sx, sy);
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  return { tx: w/2 - cx*scale, ty: h/2 - cy*scale, scale };
}

function render() {
  const w = svg.clientWidth || 360, h = svg.clientHeight || 400;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  view = userView || fitView();
  document.documentElement.style.setProperty('--ghost-opacity', state.settings.ghostOpacity);
  svg.innerHTML = `<defs>
    <pattern id="porchHatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9bb3cc" stroke-width="1"/>
    </pattern>
    <pattern id="unfinishedHatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#888" stroke-width="1"/>
    </pattern>
  </defs>`;
  const W = p => ({ x: view.tx + p.x*view.scale, y: view.ty + p.y*view.scale });

  // Ghosts (other floors)
  if (state.settings.showFloorGhosts) {
    shapesOnOtherFloors().forEach(sh => renderShape(sh, W, true));
  }
  // Active floor
  shapesOnFloor(state.activeFloor).forEach(sh => renderShape(sh, W, false));
  // In-progress walk
  if (state.segments.length) renderInProgress(W);
  else {
    const sp = W(getStart());
    addEl('circle', { cx: sp.x, cy: sp.y, r: 6, fill: '#2e8b57' });
    addEl('text', { x: sp.x + 10, y: sp.y + 4, 'font-size': 11, fill: '#666' }, 'start');
  }
  // Fence rectangle (live) + selection highlight rings
  if (fenceDraw) {
    const a = W(fenceDraw.start), b = W(fenceDraw.end);
    const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
    const w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
    addEl('rect', { x, y, width: w, height: h, fill: 'rgba(229,124,0,0.10)', stroke: '#e57c00', 'stroke-width': 1.5, 'stroke-dasharray': '4,3' });
  }
  if (fenceSelection) {
    const ring = (sx, sy) => addEl('circle', { cx: sx, cy: sy, r: 7, fill: 'none', stroke: '#2b6cb0', 'stroke-width': 2.5 });
    fenceSelection.shapeVerts.forEach(({ shapeId, idx }) => {
      const sh = state.shapes.find(s => s.id === shapeId);
      if (!sh) return;
      const p = W(sh.points[idx]);
      ring(p.x, p.y);
    });
    if (state.segments.length) {
      const wpts = pathPoints(state.segments, getStart());
      fenceSelection.inProgVerts.forEach(i => { const p = W(wpts[i]); ring(p.x, p.y); });
    }
  }
  // Auto-extend candidate preview (orange dashed line + ring at the target vertex)
  if (autoExtendPreview) {
    const startW = state.segments.length
      ? pathPoints(state.segments, getStart()).slice(-1)[0]
      : getStart();
    const target = autoExtendPreview.candidates[autoExtendPreview.candIdx].point;
    const a = W(startW), b = W(target);
    addEl('path', { d: `M${a.x} ${a.y} L${b.x} ${b.y}`, fill: 'none', stroke: '#e57c00', 'stroke-width': 2, 'stroke-dasharray': '5,3' });
    addEl('circle', { cx: b.x, cy: b.y, r: 9, fill: 'none', stroke: '#e57c00', 'stroke-width': 2 });
    addEl('text', {
      x: (a.x + b.x)/2, y: (a.y + b.y)/2 - 8,
      'text-anchor': 'middle', 'font-size': 12, 'font-weight': 'bold',
      fill: '#e57c00', stroke: 'white', 'stroke-width': 3, 'paint-order': 'stroke fill'
    }, `${formatLength(autoExtendPreview.candidates[autoExtendPreview.candIdx].along)} ${autoExtendPreview.dir}`);
  }
  renderStatus();
}

function renderShape(sh, W, isGhost) {
  const t = TYPES[sh.type] || TYPES.living;
  const screenPts = sh.points.map(W);
  const d = screenPts.map((p,i)=> (i===0?'M':'L') + p.x + ' ' + p.y).join(' ') + ' Z';
  const cls = isGhost ? 'ghost' : '';
  const canPickStart = state.segments.length === 0;
  const fillPoly = addEl('path', { d, fill: t.fill, stroke: 'none', class: cls });
  // Suppress shape-editor click when picking start so taps land on vertices, not the body
  if (!isGhost && !canPickStart) fillPoly.addEventListener('click', (ev) => {
    ev.stopPropagation();
    state.selection = { kind: 'shape', shapeId: sh.id };
    openShapeEditor(sh);
  });
  // Walls
  for (let i = 0; i < sh.segments.length; i++) {
    const a = screenPts[i], b = screenPts[i+1];
    const isSel = !isGhost && state.selection && state.selection.kind === 'wall' && state.selection.shapeId === sh.id && state.selection.idx === i;
    const wallClass = 'visible-wall' + (isSel ? ' selected' : '') + (isGhost ? ' ghost' : '');
    const line = addEl('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: wallClass });
    if (t.dashed) line.setAttribute('stroke-dasharray', '8,5');
    if (!isGhost) {
      // Wider invisible hit line for touch
      const hit = addEl('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: 'transparent', 'stroke-width': 30 });
      hit.addEventListener('click', (ev) => {
        ev.stopPropagation();
        state.selection = { kind: 'wall', shapeId: sh.id, idx: i };
        openWallEditor(sh, i);
      });
    }
    // Length label
    if (state.settings.showSegmentLabels) {
      const mx = (a.x + b.x)/2, my = (a.y + b.y)/2;
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy);
      if (len >= 30) {
        const nx = -dy/len, ny = dx/len;
        const c = W(polygonCentroid(sh.points));
        const sign = ((mx - c.x)*nx + (my - c.y)*ny) > 0 ? 1 : -1;
        addEl('text', {
          x: mx + nx*12*sign, y: my + ny*12*sign,
          'text-anchor':'middle', 'dominant-baseline':'middle',
          'font-size': 11, 'font-weight': 'bold', fill: '#0066cc', class: cls
        }, formatLength(sh.segments[i].length));
      }
    }
  }
  // Centroid label
  if (state.settings.showCentroidLabels) {
    const c = W(polygonCentroid(sh.points));
    const area = polygonArea(sh.points);
    addEl('text', { x: c.x, y: c.y-6, 'text-anchor':'middle', 'font-size': 13, 'font-weight':'bold', class: cls }, sh.label);
    addEl('text', { x: c.x, y: c.y+10, 'text-anchor':'middle', 'font-size': 11, fill: '#555', class: cls }, `${Math.round(area)} sq ft`);
  }
  // Pickable vertex dots — only when no in-progress walk. Tap to anchor start here.
  if (canPickStart) {
    const startP = getStart();
    sh.points.slice(0, -1).forEach((p, i) => {
      const sp = W(p);
      const isStart = Math.abs(p.x - startP.x) < 1e-4 && Math.abs(p.y - startP.y) < 1e-4;
      addEl('circle', { cx: sp.x, cy: sp.y, r: 6, class: 'vertex-pickable' + (isStart ? ' is-start' : '') });
      const hit = addEl('circle', { cx: sp.x, cy: sp.y, r: 18, fill: 'transparent' });
      hit.addEventListener('click', (ev) => {
        ev.stopPropagation();
        openVertexMenu({ x: p.x, y: p.y }, sh, i, isGhost);
      });
    });
  }
}

function openVertexMenu(p, sh, vIdx, isGhost) {
  if (fenceMode) return; // fence-drag intercepts vertex taps
  const canBeStart = state.segments.length === 0;
  const canMove    = !isGhost;
  const lines = [];
  if (canBeStart) lines.push(`<button class="primary" id="vm-start">📍 Use as next start point</button>`);
  if (canMove)    lines.push(`<button id="vm-move">↔ Move this vertex by offset…</button>`);
  if (!lines.length) lines.push(`<p style="color:#888; font-size:12px;">No actions available for this vertex.</p>`);
  showModal(`
    <h3>Vertex on "${escapeHtml(sh.label)}"${isGhost ? ' (other floor)' : ''}</h3>
    <p style="font-size:12px; color:#666; margin: 0;">at (${p.x.toFixed(2)}, ${p.y.toFixed(2)}) ft</p>
    <div style="display:flex; flex-direction:column; gap:8px; margin-top:8px;">
      ${lines.join('')}
    </div>
    <div class="modal-buttons">
      <button onclick="closeModal()">Cancel</button>
    </div>
  `);
  if (canBeStart) $('vm-start').onclick = () => {
    closeModal();
    setStartPoint(p, sh.label, isGhost);
  };
  if (canMove) $('vm-move').onclick = () => openVertexMoveModal(sh, vIdx);
}

function openVertexMoveModal(sh, vIdx) {
  const render_ = () => {
    const p = sh.points[vIdx];
    showModal(`
      <h3>Move vertex on "${escapeHtml(sh.label)}"</h3>
      <p style="font-size:13px; color:#222; margin: 0;">
        Position: <b>(${p.x.toFixed(2)}, ${p.y.toFixed(2)}) ft</b>
      </p>
      <hr style="border:none; border-top:1px solid #eee; margin: 4px 0;">
      <p style="font-size:11px; color:#888; margin: 0; text-transform:uppercase;">Snap to next aligned vertex</p>
      <div class="row" style="display:flex; gap:6px;">
        <button class="primary" data-snap="l" style="flex:1; padding:12px; font-weight:bold; font-size:16px;">← L</button>
        <button class="primary" data-snap="u" style="flex:1; padding:12px; font-weight:bold; font-size:16px;">↑ U</button>
        <button class="primary" data-snap="d" style="flex:1; padding:12px; font-weight:bold; font-size:16px;">↓ D</button>
        <button class="primary" data-snap="r" style="flex:1; padding:12px; font-weight:bold; font-size:16px;">R →</button>
      </div>
      <p style="font-size:11px; color:#888; margin: 8px 0 0; text-transform:uppercase;">Or move by typed offset</p>
      <div class="row" style="display:flex; gap:6px;">
        <input id="vmove-input" type="text" inputmode="text" placeholder="e.g. 3'6 r, 6&quot; d, or 2'l 1'u"
          style="flex:1; padding:10px; font-size:16px; border:1px solid #ccc; border-radius:8px;">
        <button class="primary" id="vmove-apply" style="padding:0 14px;">Apply</button>
      </div>
      <div class="modal-buttons">
        <button onclick="closeModal()">Done</button>
      </div>
    `);
    document.querySelectorAll('#modal [data-snap]').forEach(b => {
      b.onclick = () => moveVertexToAligned(sh, vIdx, b.dataset.snap, render_);
    });
    const apply = () => {
      const v = $('vmove-input').value.trim();
      if (!v) { toast('Enter an offset like 3\'6 r'); return; }
      let seg;
      try { seg = parseSegment(v); } catch (err) { toast(err.message); return; }
      if (seg.autoExtend) { toast('Need an explicit length'); return; }
      pushUndo();
      moveVertexByVector(sh, vIdx, seg.dx, seg.dy);
      render();
      render_();    // refresh modal with new position
      toast(`Moved by ${formatLength(seg.length)} ${seg.dir}`);
    };
    $('vmove-apply').onclick = apply;
    $('vmove-input').addEventListener('keydown', e => { if (e.key === 'Enter') apply(); });
  };
  render_();
}

function moveVertexToAligned(sh, vIdx, dir, onDone) {
  const p = sh.points[vIdx];
  // Pretend the vertex is the "pen" and look forward in `dir` for aligned vertices.
  // Skip the vertex itself (it'll be its own "start" point so its along-distance is 0).
  let cands = findAlignedCandidates([], dir, { x: p.x, y: p.y }, state.shapes);
  // Also filter out any candidate at this exact vertex (along ~= 0 is already filtered by minForward, but defensive)
  cands = cands.filter(c => Math.hypot(c.point.x - p.x, c.point.y - p.y) > 0.01);
  // Fall back to perpendicular projection if no direct alignment
  if (!cands.length) cands = findProjectedCandidates([], dir, { x: p.x, y: p.y }, state.shapes);
  if (!cands.length) { toast(`No vertex / projection to the ${dir}`); return; }
  pushUndo();
  const target = cands[0].point;
  sh.points[vIdx].x = target.x;
  sh.points[vIdx].y = target.y;
  syncClosure(sh, vIdx);
  rebuildSegments(sh);
  render();
  if (onDone) onDone();
  toast(`Snapped ${dir} → (${target.x.toFixed(2)}, ${target.y.toFixed(2)})`);
}

function screenToWorld(clientX, clientY) {
  const rect = svg.getBoundingClientRect();
  const vbW = svg.viewBox.baseVal.width  || rect.width;
  const vbH = svg.viewBox.baseVal.height || rect.height;
  const sx = (clientX - rect.left) * (vbW / rect.width);
  const sy = (clientY - rect.top)  * (vbH / rect.height);
  return { x: (sx - view.tx) / view.scale, y: (sy - view.ty) / view.scale };
}

// ----- Fence mode -----
function enterFenceMode() {
  fenceMode = true;
  fenceDraw = null;
  fenceSelection = null;
  cancelAutoExtend();
  document.body.classList.add('fence-active');
  $('controls').classList.add('fence-active');
  const tog = $('btn-fence-toggle'); if (tog) { tog.textContent = '✗'; tog.title = 'Exit fence mode'; }
  updateFencePanel();
  render();
}
function exitFenceMode() {
  fenceMode = false;
  fenceDraw = null;
  fenceSelection = null;
  document.body.classList.remove('fence-active');
  $('controls').classList.remove('fence-active');
  const tog = $('btn-fence-toggle'); if (tog) { tog.textContent = '🔲'; tog.title = 'Group select / fence'; }
  render();
}
function toggleFenceMode() { if (fenceMode) exitFenceMode(); else enterFenceMode(); }
function updateFencePanel() {
  if (!fenceMode) return;
  const sel = fenceSelection;
  $('fence-status').textContent = sel
    ? `Selected: ${sel.shapeVerts.length} shape vertices · ${sel.inProgVerts.length} in-progress vertices. Walls fully inside translate; walls crossing the fence stretch.`
    : 'Drag on the canvas to select vertices inside a rectangle. (Pinch to zoom still works.)';
}

function finalizeFenceSelection(a, b) {
  const x1 = Math.min(a.x, b.x), x2 = Math.max(a.x, b.x);
  const y1 = Math.min(a.y, b.y), y2 = Math.max(a.y, b.y);
  const inside = p => p.x >= x1 && p.x <= x2 && p.y >= y1 && p.y <= y2;
  const sel = { shapeVerts: [], inProgVerts: [] };
  state.shapes.filter(s => s.floor === state.activeFloor).forEach(sh => {
    for (let i = 0; i < sh.points.length - 1; i++) {
      if (inside(sh.points[i])) sel.shapeVerts.push({ shapeId: sh.id, idx: i });
    }
  });
  if (state.segments.length) {
    pathPoints(state.segments, getStart()).forEach((p, i) => {
      if (inside(p)) sel.inProgVerts.push(i);
    });
  }
  fenceSelection = sel;
  updateFencePanel();
  render();
}

function applyFenceMove() {
  if (!fenceSelection) { toast('Drag a rectangle first'); return; }
  const total = fenceSelection.shapeVerts.length + fenceSelection.inProgVerts.length;
  if (!total) { toast('Selection is empty'); return; }
  const raw = $('fence-move-input').value.trim();
  if (!raw) { toast('Enter an offset like 3\'6 r'); return; }
  let seg;
  try { seg = parseSegment(raw); } catch (err) { toast(err.message); return; }
  if (seg.autoExtend) { toast('Need an explicit length'); return; }
  pushUndo();
  const affected = new Set();
  fenceSelection.shapeVerts.forEach(({ shapeId, idx }) => {
    const sh = state.shapes.find(s => s.id === shapeId);
    if (!sh) return;
    sh.points[idx].x += seg.dx;
    sh.points[idx].y += seg.dy;
    syncClosure(sh, idx);
    affected.add(shapeId);
  });
  affected.forEach(id => { const sh = state.shapes.find(s => s.id === id); if (sh) rebuildSegments(sh); });
  if (fenceSelection.inProgVerts.length && state.segments.length) {
    const wpts = pathPoints(state.segments, getStart()).map(p => ({ x: p.x, y: p.y }));
    const idxSet = new Set(fenceSelection.inProgVerts);
    wpts.forEach((p, i) => { if (idxSet.has(i)) { p.x += seg.dx; p.y += seg.dy; } });
    if (idxSet.has(0)) state.startPoint = { x: wpts[0].x, y: wpts[0].y };
    state.segments.forEach((s, i) => {
      const dx = wpts[i+1].x - wpts[i].x, dy = wpts[i+1].y - wpts[i].y;
      s.dx = dx; s.dy = dy; s.length = Math.hypot(dx, dy);
      s.dir = Math.abs(dx) >= Math.abs(dy) ? (dx >= 0 ? 'r' : 'l') : (dy >= 0 ? 'd' : 'u');
      s.angle = 0;
      s.raw = `${formatLength(s.length)} ${s.dir} (adj)`;
    });
  }
  $('fence-move-input').value = '';
  fenceSelection = null;
  updateFencePanel();
  render();
  toast(`Moved by ${formatLength(seg.length)} ${seg.dir}`);
}

function setStartPoint(p, shapeLabel, isGhost) {
  pushUndo();
  state.startPoint = { x: p.x, y: p.y };
  const where = shapeLabel ? ` (vertex on "${shapeLabel}"${isGhost ? ', other floor' : ''})` : '';
  toast(`Start moved to (${p.x.toFixed(2)}, ${p.y.toFixed(2)}) ft${where}`);
  render();
}

function resetStart() {
  if (state.startPoint === null) { toast('Start is already at origin'); return; }
  pushUndo();
  state.startPoint = null;
  toast('Start reset to origin (0, 0)');
  render();
}

function offsetStartBy(text) {
  if (!text || !text.trim()) return;
  let seg;
  try { seg = parseSegment(text.trim()); } catch (err) { toast(err.message); return; }
  if (seg.autoExtend) { toast('Need an explicit length, e.g. 3\'6 r'); return; }
  pushUndo();
  const cur = getStart();
  state.startPoint = { x: cur.x + seg.dx, y: cur.y + seg.dy };
  toast(`Start offset by ${formatLength(seg.length)} ${seg.dir}`);
  render();
}

function renderInProgress(W) {
  const wpts = pathPoints(state.segments, getStart());
  const pts = wpts.map(W);
  const d = pts.map((p,i) => (i===0?'M':'L') + p.x + ' ' + p.y).join(' ');
  addEl('path', { d, fill: 'none', stroke: '#2b6cb0', 'stroke-width': 2.5, 'stroke-dasharray': '5,3' });
  const start = pts[0], pen = pts[pts.length-1];
  addEl('circle', { cx: start.x, cy: start.y, r: 5, fill: '#2e8b57' });
  addEl('circle', { cx: pen.x, cy: pen.y, r: 6, fill: '#c44' });
  // Length labels on in-progress
  if (state.settings.showSegmentLabels) {
    state.segments.forEach((seg, i) => {
      const a = pts[i], b = pts[i+1];
      const mx = (a.x + b.x)/2, my = (a.y + b.y)/2;
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy);
      if (len < 30) return;
      const nx = -dy/len, ny = dx/len;
      addEl('text', { x: mx + nx*10, y: my + ny*10, 'text-anchor':'middle', 'dominant-baseline':'middle', 'font-size': 11, fill: '#2b6cb0' }, formatLength(seg.length));
    });
  }
  // Gap indicator
  const wStart = wpts[0], wPen = wpts[wpts.length - 1];
  const gapDx = wStart.x - wPen.x, gapDy = wStart.y - wPen.y;
  const gapLen = Math.hypot(gapDx, gapDy);
  if (gapLen > state.settings.autoCloseFeet) {
    addEl('path', {
      d: `M${pen.x} ${pen.y} L${start.x} ${start.y}`,
      fill: 'none', stroke: '#e57c00', 'stroke-width': 1.5, 'stroke-dasharray': '4,4'
    });
  }
}

function renderStatus() {
  const el = $('status');
  if (!state.segments.length) {
    const sp = getStart();
    const where = state.startPoint
      ? `Start at (${sp.x.toFixed(1)}, ${sp.y.toFixed(1)}) ft — picked`
      : 'Start at origin (0, 0)';
    const hint = state.shapes.some(s => s.floor === state.activeFloor || state.settings.showFloorGhosts)
      ? '. Tap any green vertex to change start.'
      : '.';
    el.textContent = where + hint;
    el.className = 'status';
    return;
  }
  const wpts = pathPoints(state.segments, getStart());
  const start = wpts[0], pen = wpts[wpts.length-1];
  const gapDx = start.x - pen.x, gapDy = start.y - pen.y;
  const gap = Math.hypot(gapDx, gapDy);
  if (gap < state.settings.autoCloseFeet) {
    el.textContent = `✓ Closed (${state.segments.length} walls). Tap ✓ at top to save shape.`;
    el.className = 'status closed';
  } else {
    el.textContent = `gap ${formatLength(gap)} (${formatGapBreakdown(gapDx, gapDy)})`;
    el.className = 'status gap';
  }
}

// =============================================================================
// INPUT — keypad builds a single text buffer that parseSegment consumes.
// Matches the desktop's typed-segment flow:
//   "16'4 r"          → cardinal wall
//   "2'6 r 1'6 d"     → diagonal via rise/run (auto-combines components)
//   "16'4 r 45"       → wall with 45° turn from previous heading
//   "r" (no length)   → auto-extend to next aligned vertex
// =============================================================================

const DIR_KEYS = { l: 'l', r: 'r', u: 'u', d: 'd' };

function lastChar() { return entryText.slice(-1); }
function endsWithSpace() { return lastChar() === ' ' || entryText === ''; }

function appendEntry(ch, { spaceBefore = false } = {}) {
  if (spaceBefore && entryText && !endsWithSpace()) entryText += ' ';
  entryText += ch;
  updateEntryDisplay();
}

function backspaceEntry() {
  if (!entryText) return;
  // Strip trailing space, then one meaningful char
  entryText = entryText.replace(/\s+$/, '');
  entryText = entryText.slice(0, -1);
  entryText = entryText.replace(/\s+$/, '');
  updateEntryDisplay();
}

function clearEntry() {
  entryText = '';
  updateEntryDisplay();
}

function pressKey(k) {
  switch (k) {
    case 'back':  cancelAutoExtend(); backspaceEntry(); return;
    case 'clear': cancelAutoExtend(); clearEntry();     return;
    case 'add':   commitEntry();    return;
    case 'ft':    cancelAutoExtend(); appendEntry("'"); return;
    case 'in':    cancelAutoExtend(); appendEntry('"'); return;
    case '+':     cancelAutoExtend(); appendEntry('+'); return;
    case '.':     cancelAutoExtend(); appendEntry('.'); return;
    case 'l': case 'r': case 'u': case 'd':
      pressDirection(k);
      return;
    default:
      if (/^\d$/.test(k)) { cancelAutoExtend(); appendEntry(k); }
  }
}

function pressDirection(d) {
  // If the entry already has digits, the user is mid-segment — append the
  // direction to the entry as usual (length-then-direction flow).
  if (entryText.trim()) {
    appendEntry(d, { spaceBefore: true });
    return;
  }
  // Otherwise: enter / cycle the auto-extend preview for this direction.
  if (autoExtendPreview && autoExtendPreview.dir === d) {
    autoExtendPreview.candIdx = (autoExtendPreview.candIdx + 1) % autoExtendPreview.candidates.length;
  } else {
    // First pass: directly aligned vertices (same row/column as pen).
    let cands = findAlignedCandidates(state.segments, d, getStart(), state.shapes);
    // Fallback: walk to the perpendicular line of any vertex — i.e. "walk L until
    // pen's X matches another vertex's X". Lets you navigate back toward a shape's
    // column or row even when no vertex is directly aligned.
    if (!cands.length) cands = findProjectedCandidates(state.segments, d, getStart(), state.shapes);
    if (!cands.length) { toast(`No vertex or projection to the ${d}`); return; }
    autoExtendPreview = { dir: d, candIdx: 0, candidates: cands };
  }
  updateEntryDisplay();
  render();
}

// Walking-to-perpendicular-line candidates. For a horizontal direction (L/R),
// finds vertices whose X is reachable by walking that way and produces a
// segment that lands at (vertex.x, pen.y). Vertical directions (U/D) mirror.
function findProjectedCandidates(priorSegments, dir, start, shapes) {
  const isHoriz = dir === 'r' || dir === 'l';
  const sign    = dir === 'r' || dir === 'd' ? 1 : -1;
  let x = start.x, y = start.y;
  for (const s of priorSegments) { x += s.dx; y += s.dy; }
  const out = [];
  const seen = new Set();
  const pushIf = (coord) => {
    const along = (coord - (isHoriz ? x : y)) * sign;
    if (along < 0.05) return;
    const target = isHoriz ? { x: coord, y } : { x, y: coord };
    const key = `${target.x.toFixed(3)},${target.y.toFixed(3)}`;
    if (seen.has(key)) return;
    seen.add(key);
    out.push({
      along,
      point: target,
      segment: {
        length: along, dir, angle: 0,
        dx: isHoriz ? (coord - x) : 0,
        dy: isHoriz ? 0 : (coord - y),
        raw: `${formatLength(along)} ${dir} (proj)`,
      },
    });
  };
  for (const sh of shapes) {
    for (let i = 0; i < sh.points.length - 1; i++) {
      pushIf(isHoriz ? sh.points[i].x : sh.points[i].y);
    }
  }
  // Also project from in-progress walk vertices (incl. start)
  let px = start.x, py = start.y;
  pushIf(isHoriz ? px : py);
  for (const s of priorSegments) {
    px += s.dx; py += s.dy;
    pushIf(isHoriz ? px : py);
  }
  out.sort((a, b) => a.along - b.along);
  return out;
}

function cancelAutoExtend() {
  if (!autoExtendPreview) return;
  autoExtendPreview = null;
  render();
}

function previewSegment() {
  if (!entryText.trim()) return null;
  const priorHeading = state.segments.length ? headingDeg(state.segments[state.segments.length - 1]) : null;
  try { return parseSegment(entryText, priorHeading); } catch (e) { return { error: e.message }; }
}

function updateEntryDisplay() {
  const v = $('entry-value');
  const p = $('entry-preview');
  if (autoExtendPreview) {
    const c = autoExtendPreview.candidates[autoExtendPreview.candIdx];
    const isProj = /\(proj\)/.test(c.segment.raw);
    v.textContent = `↳ ${autoExtendPreview.dir.toUpperCase()} → ${formatLength(c.along)}${isProj ? ' (project)' : ''}`;
    v.classList.remove('placeholder');
    p.textContent = `candidate ${autoExtendPreview.candIdx + 1} of ${autoExtendPreview.candidates.length} · tap ${autoExtendPreview.dir.toUpperCase()} again to cycle, ✓ to commit`;
    $('btn-add').classList.remove('disabled');
    return;
  }
  if (!entryText) {
    v.textContent = 'type length, then direction';
    v.classList.add('placeholder');
    p.textContent = '';
  } else {
    v.textContent = entryText;
    v.classList.remove('placeholder');
    const seg = previewSegment();
    if (!seg || seg.error) p.textContent = '';
    else if (seg.autoExtend) p.textContent = '↳ auto-extend ' + seg.dir;
    else p.textContent = `→ ${formatLength(seg.length)} ${seg.dir}${seg.angle ? ' @ ' + seg.angle + '°' : ''}`;
  }
  $('btn-add').classList.toggle('disabled', !entryText.trim());
}

function commitEntry() {
  // Auto-extend preview commits the currently-selected candidate
  if (autoExtendPreview) {
    pushUndo();
    state.segments.push(autoExtendPreview.candidates[autoExtendPreview.candIdx].segment);
    autoExtendPreview = null;
    entryText = '';
    updateEntryDisplay();
    render();
    return;
  }
  if (!entryText.trim()) return;
  const priorHeading = state.segments.length ? headingDeg(state.segments[state.segments.length - 1]) : null;
  let seg;
  try { seg = parseSegment(entryText, priorHeading); }
  catch (err) { toast(err.message); return; }
  pushUndo();
  if (seg.autoExtend) {
    const cands = findAlignedCandidates(state.segments, seg.dir, getStart(), state.shapes);
    if (!cands.length) { toast('No aligned vertex to snap to'); state.undoStack.pop(); return; }
    state.segments.push(cands[0].segment);
  } else {
    state.segments.push(seg);
  }
  entryText = '';
  updateEntryDisplay();
  render();
}

function openWallEditor(sh, wallIdx) {
  const len = wallLength(sh, wallIdx);
  showModal(`
    <h3>Wall ${wallIdx + 1} of "${escapeHtml(sh.label)}"</h3>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <label style="font-size:12px; color:#666;">Current length: ${formatLength(len)}</label>
      <input id="wall-len-input" type="text" inputmode="text" value="${formatLength(len)}"
        style="padding:10px; font-size:16px; border:1px solid #ccc; border-radius:8px;">
      <label style="font-size:12px; color:#666;">New length (e.g. 16'4):</label>
    </div>
    <div class="modal-buttons">
      <button onclick="closeModal()">Cancel</button>
      <button class="danger" id="wall-delete-btn">Delete wall</button>
      <button class="primary" id="wall-apply-btn">Apply</button>
    </div>
  `);
  $('wall-apply-btn').onclick = () => {
    const newLen = parseLength($('wall-len-input').value);
    if (!(newLen > 0)) { toast('Invalid length'); return; }
    pushUndo();
    setWallLength(sh, wallIdx, newLen, state.settings.defaultLengthEditMode);
    closeModal();
    render();
  };
  $('wall-delete-btn').onclick = () => {
    if (!confirm('Delete this wall (merge adjacent walls)?')) return;
    pushUndo();
    if (deleteVertex(sh, wallIdx + 1)) {
      closeModal();
      render();
    } else {
      toast("Can't delete — shape needs at least 3 walls.");
      state.undoStack.pop();
    }
  };
}

function openShapeEditor(sh) {
  const typeOpts = Object.entries(TYPES).map(([k, v]) =>
    `<option value="${k}"${k === sh.type ? ' selected' : ''}>${v.name}</option>`).join('');
  const floorOpts = state.floors.map(f =>
    `<option value="${f}"${f === sh.floor ? ' selected' : ''}>${f}</option>`).join('');
  showModal(`
    <h3>Shape "${escapeHtml(sh.label)}"</h3>
    <label style="font-size:12px; color:#666;">Label</label>
    <input id="sh-label" type="text" value="${escapeHtml(sh.label)}"
      style="padding:10px; font-size:16px; border:1px solid #ccc; border-radius:8px;">
    <label style="font-size:12px; color:#666;">Type</label>
    <select id="sh-type" style="padding:10px; font-size:16px; border:1px solid #ccc; border-radius:8px;">${typeOpts}</select>
    <label style="font-size:12px; color:#666;">Floor</label>
    <select id="sh-floor" style="padding:10px; font-size:16px; border:1px solid #ccc; border-radius:8px;">${floorOpts}</select>
    <div class="modal-buttons">
      <button onclick="closeModal()">Cancel</button>
      <button class="danger" id="sh-delete-btn">Delete shape</button>
      <button class="primary" id="sh-apply-btn">Apply</button>
    </div>
  `);
  $('sh-apply-btn').onclick = () => {
    pushUndo();
    sh.label = $('sh-label').value || sh.label;
    sh.type = $('sh-type').value;
    sh.floor = $('sh-floor').value;
    closeModal();
    render();
    renderDrawer();
  };
  $('sh-delete-btn').onclick = () => {
    if (!confirm('Delete this entire shape?')) return;
    pushUndo();
    state.shapes = state.shapes.filter(s => s.id !== sh.id);
    state.selection = null;
    closeModal();
    render();
    renderDrawer();
  };
}

// =============================================================================
// CLOSE SHAPE
// =============================================================================
function closeShape() {
  if (!state.segments.length) { toast('Walk some segments first'); return; }
  const wpts = pathPoints(state.segments, getStart());
  const start = wpts[0], pen = wpts[wpts.length-1];
  const gap = Math.hypot(start.x - pen.x, start.y - pen.y);
  let pts = wpts;
  if (gap > state.settings.autoCloseFeet) {
    if (!confirm(`Path doesn't close (gap ${formatLength(gap)}). Force-close with a straight line back to start?`)) return;
    pts = [...wpts, { ...start }];
  } else {
    pts = wpts.map((p, i) => i === wpts.length-1 ? { ...start } : p);
  }
  const label = prompt('Label for this area:', `Area ${state.nextShapeId}`);
  if (label === null) return;
  const typeKey = prompt(`Type? (${Object.keys(TYPES).join(', ')})`, 'living');
  if (!typeKey || !(typeKey in TYPES)) { toast('Cancelled.'); return; }
  pushUndo();
  const shape = {
    id: state.nextShapeId++,
    label, type: typeKey,
    floor: state.activeFloor,
    points: pts,
    segments: [],
  };
  rebuildSegments(shape);
  state.shapes.push(shape);
  state.segments = [];
  state.startPoint = null;
  clearEntry();
  render();
  renderDrawer();
}

function cancelWalk() {
  if (!state.segments.length) return;
  if (!confirm('Discard current segments?')) return;
  pushUndo();
  state.segments = [];
  clearEntry();
  render();
}

function openDrawer() { $('drawer').classList.add('open'); $('drawer-bg').classList.add('open'); renderDrawer(); }
function closeDrawer() { $('drawer').classList.remove('open'); $('drawer-bg').classList.remove('open'); }

function renderDrawer() {
  // Floor tabs
  $('floor-tabs').innerHTML = state.floors.map(f =>
    `<button data-floor="${f}" class="${f === state.activeFloor ? 'active' : ''}">${f}</button>`
  ).join('');
  document.querySelectorAll('#floor-tabs button').forEach(b => {
    b.onclick = () => {
      state.activeFloor = b.dataset.floor;
      state.selection = null;
      renderDrawer();
      render();
    };
  });
  // Shape list
  const shapes = shapesOnFloor(state.activeFloor);
  $('shape-list').innerHTML = shapes.length
    ? shapes.map(sh => {
        const area = Math.round(polygonArea(sh.points));
        return `<div class="item" data-id="${sh.id}">
          <span>${escapeHtml(sh.label)}</span>
          <span style="color:#666;">${area} sf</span>
        </div>`;
      }).join('')
    : '<div style="color:#999; padding:8px;">No areas yet on this floor.</div>';
  document.querySelectorAll('#shape-list .item').forEach(el => {
    el.onclick = () => {
      const id = parseInt(el.dataset.id);
      const sh = state.shapes.find(s => s.id === id);
      if (sh) { closeDrawer(); openShapeEditor(sh); }
    };
  });
  // Subject
  $('subject-input').value = state.subject || '';
  // Start info
  const sp = getStart();
  const info = state.startPoint
    ? `Picked at (${sp.x.toFixed(2)}, ${sp.y.toFixed(2)}) ft. Walk segments start here.`
    : `Origin (0, 0). Tap a green vertex on the canvas to anchor the start elsewhere.`;
  $('drawer-start-info').textContent = info;
  // Ghost slider
  $('ghost-slider').value = state.settings.ghostOpacity;
  $('ghost-val').textContent = Math.round(state.settings.ghostOpacity * 100) + '%';

function showModal(html) {
  $('modal').innerHTML = html;
  $('modal-bg').classList.add('open');
}
function closeModal() { $('modal-bg').classList.remove('open'); $('modal').innerHTML = ''; }

let toastTimer = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// =============================================================================
// EXPORT
// =============================================================================
function svgForExport() {
  const ns = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs, text) => {
    const el = document.createElementNS(ns, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    if (text !== undefined) el.textContent = text;
    return el;
  };
  // Bbox of content
  const allPts = [];
  state.shapes.forEach(sh => allPts.push(...sh.points));
  if (state.segments.length) allPts.push(...pathPoints(state.segments, getStart()));
  let bbox;
  if (!allPts.length) bbox = { x: 0, y: 0, w: 100, h: 100 };
  else {
    const xs = allPts.map(p => p.x), ys = allPts.map(p => p.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const pad = Math.max(maxX - minX, maxY - minY) * 0.05 + 1;
    bbox = { x: minX - pad, y: minY - pad, w: (maxX - minX) + pad*2, h: (maxY - minY) + pad*2 };
  }
  const includeTitle = state.settings.exportIncludeTitle && (state.subject || '').trim().length > 0;
  const usedTypes = [...new Set(state.shapes.map(s => s.type))].filter(k => k in TYPES);
  const includeLegend = state.settings.exportIncludeLegend && usedTypes.length > 0;
  const titleH = includeTitle ? 80 : 0;
  const legendH = includeLegend ? (24 + 28 + usedTypes.length * 26 + 32) : 0;
  const page = EXPORT_PAGE_SIZES[state.settings.exportPageSize] || { w: 816, h: 1056 };
  const pageW = page.w, pageH = page.h;
  const sideMargin = 24;
  const canvasAvailW = pageW - sideMargin*2;
  const canvasAvailH = pageH - titleH - legendH - sideMargin*2;
  // World-coord scale to fit content tight
  const fitScale = Math.min(canvasAvailW / bbox.w, canvasAvailH / bbox.h);
  const fittedW = bbox.w * fitScale, fittedH = bbox.h * fitScale;
  const cx = sideMargin + (canvasAvailW - fittedW)/2;
  const cy = titleH + sideMargin + (canvasAvailH - fittedH)/2;
  const out = document.createElementNS(ns, 'svg');
  out.setAttribute('xmlns', ns);
  out.setAttribute('width', pageW);
  out.setAttribute('height', pageH);
  out.setAttribute('viewBox', `0 0 ${pageW} ${pageH}`);
  // White bg
  out.appendChild(mk('rect', { width: pageW, height: pageH, fill: '#fff' }));
  // Defs (hatches)
  const defs = mk('defs', {});
  defs.innerHTML = `
    <pattern id="porchHatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9bb3cc" stroke-width="1"/>
    </pattern>
    <pattern id="unfinishedHatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#888" stroke-width="1"/>
    </pattern>`;
  out.appendChild(defs);
  // Title
  if (includeTitle) {
    out.appendChild(mk('text', { x: pageW/2, y: 38, 'text-anchor':'middle', 'font-family':'Arial, sans-serif', 'font-size':22, 'font-weight':'bold', fill:'#222' }, state.subject.trim()));
    out.appendChild(mk('text', { x: pageW/2, y: 60, 'text-anchor':'middle', 'font-family':'Arial, sans-serif', 'font-size':13, fill:'#555' }, 'Not to scale — dimensions as labeled'));
  }
  // Nested SVG for the floor plan
  const nested = document.createElementNS(ns, 'svg');
  nested.setAttribute('x', cx); nested.setAttribute('y', cy);
  nested.setAttribute('width', fittedW); nested.setAttribute('height', fittedH);
  nested.setAttribute('viewBox', `${bbox.x} ${bbox.y} ${bbox.w} ${bbox.h}`);
  nested.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  // Render shapes into nested in world coords (no transform needed)
  state.shapes.forEach(sh => {
    const t = TYPES[sh.type] || TYPES.living;
    const d = sh.points.map((p,i) => (i===0?'M':'L') + p.x + ' ' + p.y).join(' ') + ' Z';
    const poly = mk('path', { d, fill: t.fill, stroke: 'black', 'stroke-width': Math.max(0.1, bbox.w/300) });
    if (t.dashed) poly.setAttribute('stroke-dasharray', `${bbox.w/100},${bbox.w/170}`);
    nested.appendChild(poly);
    // Length labels in world coords
    const c = polygonCentroid(sh.points);
    sh.segments.forEach((seg, i) => {
      const a = sh.points[i], b = sh.points[i+1];
      const mx = (a.x + b.x)/2, my = (a.y + b.y)/2;
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy);
      if (len < bbox.w/30) return;
      const nx = -dy/len, ny = dx/len;
      const sign = ((mx - c.x)*nx + (my - c.y)*ny) > 0 ? 1 : -1;
      const offs = bbox.w/100;
      nested.appendChild(mk('text', {
        x: mx + nx*offs*sign, y: my + ny*offs*sign,
        'text-anchor':'middle', 'dominant-baseline':'middle',
        'font-family':'Arial, sans-serif',
        'font-size': bbox.w/60, 'font-weight':'bold', fill: '#0066cc'
      }, formatLength(seg.length)));
    });
    // Centroid
    nested.appendChild(mk('text', {
      x: c.x, y: c.y - bbox.h/100, 'text-anchor':'middle',
      'font-family':'Arial, sans-serif', 'font-size': bbox.w/45, 'font-weight':'bold', fill: '#222'
    }, sh.label));
    nested.appendChild(mk('text', {
      x: c.x, y: c.y + bbox.h/60, 'text-anchor':'middle',
      'font-family':'Arial, sans-serif', 'font-size': bbox.w/60, fill: '#555'
    }, `${Math.round(polygonArea(sh.points))} sq ft`));
  });
  out.appendChild(nested);
  // Legend
  if (includeLegend) {
    const y0 = pageH - legendH + 14;
    const x0 = sideMargin;
    const lw = pageW - sideMargin*2;
    out.appendChild(mk('rect', { x: x0, y: y0 - 14, width: lw, height: legendH, fill: 'none', stroke: '#999', 'stroke-width': 0.75 }));
    out.appendChild(mk('text', { x: x0 + 14, y: y0 + 4, 'font-family':'Arial, sans-serif', 'font-size': 16, 'font-weight':'bold', fill:'#222' }, 'Legend'));
    usedTypes.forEach((key, i) => {
      const t = TYPES[key];
      const rowY = y0 + 22 + i * 26;
      const swatch = mk('rect', { x: x0 + 14, y: rowY, width: 30, height: 18, fill: t.fill, stroke: 'black', 'stroke-width': 1 });
      if (t.dashed) swatch.setAttribute('stroke-dasharray','5,3');
      out.appendChild(swatch);
      out.appendChild(mk('text', { x: x0 + 54, y: rowY + 14, 'font-family':'Arial, sans-serif', 'font-size': 13, fill:'#222' }, t.name));
      const total = state.shapes.filter(s => s.type === key).reduce((a, s) => a + polygonArea(s.points), 0);
      out.appendChild(mk('text', { x: x0 + lw - 24, y: rowY + 14, 'text-anchor':'end', 'font-family':'Arial, sans-serif', 'font-size': 13, 'font-weight':'bold', fill:'#444' }, `${Math.round(total)} sq ft`));
    });
  }
  return out;
}

async function exportPNG() {
  const out = svgForExport();
  const w = parseFloat(out.getAttribute('width')), h = parseFloat(out.getAttribute('height'));
  const xml = new XMLSerializer().serializeToString(out);
  const blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = async () => {
    const c = document.createElement('canvas');
    c.width = w*2; c.height = h*2;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    c.toBlob(async (png) => {
      const filename = (state.subject || 'sketch').replace(/[^\w\-]/g, '_') + '.png';
      try {
        const file = new File([png], filename, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: state.subject || 'Sketch' });
          return;
        }
      } catch (e) { /* fall through */ }
      triggerDownload(png, filename);
    }, 'image/png');
  };
  img.src = url;
}

async function exportSVGfile() {
  const out = svgForExport();
  const xml = new XMLSerializer().serializeToString(out);
  const blob = new Blob(['<?xml version="1.0"?>\n', xml], { type: 'image/svg+xml' });
  const filename = (state.subject || 'sketch').replace(/[^\w\-]/g, '_') + '.svg';
  try {
    const file = new File([blob], filename, { type: 'image/svg+xml' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: state.subject || 'Sketch' });
      return;
    }
  } catch (e) {}
  triggerDownload(blob, filename);
}

function triggerDownload(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function saveJSON() {
  const data = { ...state };
  delete data.undoStack; delete data.redoStack; delete data.selection;
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const filename = (state.subject || 'sketch').replace(/[^\w\-]/g, '_') + '.json';
  triggerDownload(blob, filename);
}

function loadJSON(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      Object.assign(state, d);
      state.selection = null;
      state.undoStack = []; state.redoStack = [];
      $('subject-input').value = state.subject || '';
      clearEntry();
      render();
      renderDrawer();
      toast('Sketch loaded');
    } catch (e) { toast('Load failed: ' + e.message); }
  };
  r.readAsText(file);
}

// =============================================================================
// CANVAS GESTURES — pinch zoom, two-finger pan
// =============================================================================
const activePointers = new Map();
let gestureStart = null;

svg.addEventListener('pointerdown', (e) => {
  // IMPORTANT: do NOT setPointerCapture unconditionally. On iOS, capturing the
  // pointer on a plain single-finger tap can redirect the eventual click event
  // away from child hit-circles (vertices, walls). Only capture once we know
  // we're starting a gesture (pinch or fence-drag).
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activePointers.size === 2) {
    // Pinch — capture both pointers so we keep getting move events
    activePointers.forEach((_, id) => svg.setPointerCapture(id));
    const pts = [...activePointers.values()];
    gestureStart = {
      d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y),
      cx: (pts[0].x + pts[1].x) / 2,
      cy: (pts[0].y + pts[1].y) / 2,
      view: { ...view },
    };
    fenceDraw = null;  // pinch wins over fence-drag
  } else if (fenceMode && activePointers.size === 1) {
    // Fence-drag — capture this pointer
    svg.setPointerCapture(e.pointerId);
    const p = screenToWorld(e.clientX, e.clientY);
    fenceDraw = { start: p, end: p };
    fenceSelection = null;
    render();
  }
});
svg.addEventListener('pointermove', (e) => {
  if (!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activePointers.size === 2 && gestureStart) {
    const pts = [...activePointers.values()];
    const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    const cx = (pts[0].x + pts[1].x) / 2;
    const cy = (pts[0].y + pts[1].y) / 2;
    const factor = d / Math.max(1, gestureStart.d);
    const newScale = gestureStart.view.scale * factor;
    const rect = svg.getBoundingClientRect();
    const sx = gestureStart.cx - rect.left, sy = gestureStart.cy - rect.top;
    const wx = (sx - gestureStart.view.tx) / gestureStart.view.scale;
    const wy = (sy - gestureStart.view.ty) / gestureStart.view.scale;
    const tx = (cx - rect.left) - wx * newScale;
    const ty = (cy - rect.top) - wy * newScale;
    userView = { tx, ty, scale: newScale };
    render();
  } else if (fenceMode && fenceDraw && activePointers.size === 1) {
    fenceDraw.end = screenToWorld(e.clientX, e.clientY);
    render();
  }
});
function clearPointer(e) {
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) gestureStart = null;
  if (fenceMode && fenceDraw && activePointers.size === 0) {
    const d = fenceDraw; fenceDraw = null;
    if (Math.abs(d.end.x - d.start.x) >= 0.05 || Math.abs(d.end.y - d.start.y) >= 0.05) {
      finalizeFenceSelection(d.start, d.end);
    } else {
      render();
    }
  }
}
svg.addEventListener('pointerup', clearPointer);
svg.addEventListener('pointercancel', clearPointer);
svg.addEventListener('pointerleave', clearPointer);

// Double-tap to reset view
let lastTap = 0;
svg.addEventListener('pointerdown', (e) => {
  const now = performance.now();
  if (now - lastTap < 300 && activePointers.size === 1) {
    userView = null;
    render();
  }
  lastTap = now;
});

}
$('btn-collapse').onclick = () => setControlsCollapsed(true);
$('btn-expand').onclick = () => setControlsCollapsed(false);

$('btn-menu').onclick = openDrawer;
$('drawer-bg').onclick = closeDrawer;
$('btn-undo').onclick = undoHistory;
$('btn-close-shape').onclick = closeShape;
// Fence mode wiring
$('btn-fence-toggle').onclick = toggleFenceMode;
$('btn-fence-mode').onclick = () => { enterFenceMode(); closeDrawer(); };
$('fence-done-btn').onclick  = exitFenceMode;
$('fence-clear-btn').onclick = () => { fenceSelection = null; updateFencePanel(); render(); };
$('fence-move-btn').onclick  = applyFenceMove;
$('fence-move-input').addEventListener('keydown', e => { if (e.key === 'Enter') applyFenceMove(); });

// Force-reload that bypasses all caches (HTTP cache + any active service worker)
async function forceReload() {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) { /* best effort */ }
  // Cache-bust query string + replace (avoid adding a new history entry)
  const url = location.pathname + '?v=' + Date.now() + location.hash;
  location.replace(url);
}
$('btn-force-reload').onclick = forceReload;

$('btn-reset-start').onclick = () => { resetStart(); renderDrawer(); };
$('btn-offset-start').onclick = () => {
  const v = $('start-offset-input').value;
  if (!v.trim()) { toast('Enter offset like 3\'6 r'); return; }
  offsetStartBy(v);
  $('start-offset-input').value = '';
  renderDrawer();
};
$('start-offset-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('btn-offset-start').click();
});
$('btn-cancel-walk').onclick = () => { cancelWalk(); closeDrawer(); };
$('btn-save-json').onclick = () => { saveJSON(); closeDrawer(); };
$('btn-load-json').onclick = () => $('file-input').click();
$('file-input').onchange = (e) => { if (e.target.files[0]) { loadJSON(e.target.files[0]); closeDrawer(); } };
$('btn-export-png').onclick = () => { exportPNG(); closeDrawer(); };
$('btn-export-svg').onclick = () => { exportSVGfile(); closeDrawer(); };
$('btn-add-floor').onclick = () => {
  const name = prompt('New floor name:', 'floor-' + (state.floors.length + 1));
  if (!name || state.floors.includes(name)) return;
  pushUndo();
  state.floors.push(name);
  state.activeFloor = name;
  renderDrawer(); render();
};
$('btn-rename-floor').onclick = () => {
  const old = state.activeFloor;
  const name = prompt(`Rename floor "${old}" to:`, old);
  if (!name || name === old || state.floors.includes(name)) return;
  pushUndo();
  state.floors[state.floors.indexOf(old)] = name;
  state.shapes.forEach(s => { if (s.floor === old) s.floor = name; });
  state.activeFloor = name;
  renderDrawer(); render();
};
$('subject-input').oninput = (e) => { state.subject = e.target.value; };
$('ghost-slider').oninput = (e) => {
  state.settings.ghostOpacity = parseFloat(e.target.value);
  $('ghost-val').textContent = Math.round(state.settings.ghostOpacity * 100) + '%';
  document.documentElement.style.setProperty('--ghost-opacity', state.settings.ghostOpacity);
  render();
};
$('ghost-slider').onchange = () => saveSettings();

// SVG empty-click clears selection
svg.addEventListener('click', (e) => {
  if (e.target === svg) {
    if (state.selection) { state.selection = null; render(); }
  }
});

// Re-render on resize
let resizeTimer = null;
window.addEventListener('resize', () => {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 100);
});

// =============================================================================
// SERVICE WORKER
// =============================================================================
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
  });
}

// =============================================================================
// INIT
// =============================================================================
$('header-version').textContent = 'v' + APP_VERSION;
$('drawer-version').textContent = 'v' + APP_VERSION;
updateEntryDisplay();
render();
renderDrawer();
</script>
</body>
</html>
