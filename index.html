<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b3a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CValRSketch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">

<title>CValRSketch</title>
<script src="core.js?v=0.19.1"></script>

<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Arial, sans-serif; background: #f0f0f0; color: #222; }
  header { background: #2b3a4a; color: #fff; padding: 8px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; }
  header .version-chip { font-size: 11px; color: #9fb0c2; font-family: ui-monospace, monospace; }
  header button, header label.btn { background: #4a6377; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  header button:hover, header label.btn:hover { background: #5a7388; }
  header button:disabled { background: #3a4554; color: #6a7484; cursor: not-allowed; }
  header .sep { width: 1px; background: #4a6377; height: 22px; }
  header .autosave-chip { font-size: 11px; color: #9fb0c2; font-family: ui-monospace, monospace; padding: 4px 9px; border-radius: 10px; background: #34465a; white-space: nowrap; max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
  header .autosave-chip.saved { color: #b7e4c7; }
  header .autosave-chip.saving { color: #ffe08a; }
  header .autosave-chip.paused { color: #ffd166; cursor: pointer; }
  header .autosave-chip.error { color: #ffb4a2; cursor: pointer; }
  .mode-tabs { display: flex; gap: 0; border: 1px solid #4a6377; border-radius: 4px; overflow: hidden; }
  .mode-tabs button { background: #3a4d61; border-radius: 0; padding: 6px 14px; }
  .mode-tabs button.active { background: #2b6cb0; }
  main { display: flex; height: calc(100vh - 90px); }
  #canvas-wrap { flex: 1; background: #fff; position: relative; overflow: hidden; }
  #canvas { display: block; width: 100%; height: 100%; cursor: default; }
  #canvas.split-mode { cursor: crosshair; }
  /* In Text mode the whole drawing is click-through so notes can be placed over
     areas; only the free-text labels themselves stay interactive. */
  #canvas.text-mode { cursor: text; }
  #canvas.text-mode > :not(.free-label) { pointer-events: none; }
  #floor-bar { background: #eef2f6; border-bottom: 1px solid #d0d8e0; padding: 6px 14px; display: flex; align-items: center; gap: 8px; font-size: 12px; }
  #floor-bar .ft-tabs { display: flex; gap: 4px; }
  #floor-bar .ft-tabs button { background: #fff; border: 1px solid #c0c8d0; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  #floor-bar .ft-tabs button.active { background: #2b6cb0; color: #fff; border-color: #2b6cb0; }
  #floor-bar .small-btn { background: #fff; border: 1px solid #c0c8d0; padding: 3px 7px; border-radius: 4px; cursor: pointer; font-size: 11px; }
  aside { width: 360px; background: #fafafa; border-left: 1px solid #ccc; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  aside h2 { font-size: 11px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.5px; color: #555; }
  .section { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 10px; }
  .input-row { display: flex; gap: 6px; }
  .input-row input { flex: 1; padding: 6px 8px; border: 1px solid #bbb; border-radius: 4px; font-family: monospace; font-size: 13px; }
  .input-row button { background: #2b6cb0; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .input-row button:hover { background: #3577c2; }
  .row-buttons { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .row-buttons button { flex: 1; background: #6c7a8a; color: #fff; border: none; padding: 6px; border-radius: 4px; cursor: pointer; font-size: 11px; min-width: 70px; }
  .row-buttons button:hover { background: #7d8c9d; }
  .row-buttons button.primary { background: #2e8b57; }
  .row-buttons button.primary:hover { background: #379a64; }
  .row-buttons button.danger { background: #c44; }
  .help { font-size: 11px; color: #666; line-height: 1.5; }
  .help code { background: #eef; padding: 1px 4px; border-radius: 3px; color: #224; }
  .pen-indicator { font-family: monospace; font-size: 11px; color: #555; margin-top: 4px; }
  .seg-item { display: flex; justify-content: space-between; padding: 4px 7px; background: #f4f7fa; border-radius: 3px; margin-bottom: 3px; font-family: monospace; font-size: 11px; }
  .seg-item button { background: none; border: none; color: #c44; cursor: pointer; padding: 0 4px; }
  .shape-item { padding: 8px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 6px; background: #fff; }
  .shape-item.selected { border-color: #2b6cb0; box-shadow: 0 0 0 2px rgba(43,108,176,0.15); }
  .shape-item .hdr { display: flex; justify-content: space-between; font-weight: 500; font-size: 13px; }
  .shape-item .meta { font-size: 11px; color: #666; margin-top: 2px; }
  .shape-item .actions { margin-top: 5px; display: flex; gap: 4px; flex-wrap: wrap; }
  .shape-item .actions button { font-size: 10px; padding: 3px 7px; background: #e0e6ed; border: none; border-radius: 3px; cursor: pointer; }
  .shape-item .actions button.danger { background: #fee; color: #c44; }
  #totals .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12px; }
  #totals .row.total { font-weight: bold; border-top: 1px solid #ddd; margin-top: 4px; padding-top: 4px; }
  .field { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; }
  .field label { flex: 0 0 80px; color: #444; }
  .field input, .field select { flex: 1; padding: 5px 7px; border: 1px solid #bbb; border-radius: 4px; font-size: 12px; }
  .closed-badge { color: #2e8b57; font-weight: bold; font-size: 11px; }
  .open-badge { color: #c80; font-size: 11px; }
  /* Modal */
  .modal-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: #fff; padding: 20px; border-radius: 8px; max-width: 480px; width: 90%; max-height: 80vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 12px; font-size: 16px; }
  .modal .radio-group label { display: block; padding: 8px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 6px; cursor: pointer; }
  .modal .radio-group label:hover { background: #f4f7fa; }
  .modal .radio-group input { margin-right: 8px; }
  .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .modal-buttons button { padding: 7px 16px; border-radius: 4px; cursor: pointer; border: 1px solid #bbb; background: #f0f0f0; font-size: 13px; }
  .modal-buttons button.primary { background: #2b6cb0; color: #fff; border-color: #2b6cb0; }
  .modal-buttons button.danger { background: #c44; color: #fff; border-color: #c44; }
  .settings-grid { display: grid; gap: 8px; }
  .settings-grid .row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #eee; }
  .settings-grid .row label { font-size: 12px; }
  .settings-grid .row .desc { font-size: 10px; color: #888; margin-top: 2px; }
  /* SVG interactivity */
  .hit-wall { stroke: rgba(0,0,0,0); stroke-width: 14; fill: none; cursor: pointer; }
  .hit-vertex { fill: rgba(0,0,0,0); cursor: pointer; }
  .visible-wall.selected { stroke: #2b6cb0 !important; stroke-width: 4 !important; }
  .visible-vertex { fill: #fff; stroke: #444; stroke-width: 1.5; }
  .visible-vertex.selected { fill: #2b6cb0; stroke: #fff; }
  .visible-vertex.split-hover { fill: #ffa500; stroke: #fff; }
  .visible-vertex.pickable { fill: #d4edda; stroke: #2e8b57; stroke-width: 2; }
  .ghost { opacity: var(--ghost-opacity, 0.45); pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>Sketch Walker</h1>
  <span class="version-chip" id="app-version">v0.19.1</span>
  <div class="mode-tabs" id="mode-tabs">
    <button data-mode="walk" class="active">Walk</button>
    <button data-mode="edit">Edit</button>
    <button data-mode="split">Split</button>
    <button data-mode="fence">Fence</button>
    <button data-mode="text">Text</button>
  </div>
  <div class="sep"></div>
  <button id="btn-undo" onclick="undoHistory()" title="Undo (Ctrl+Z)">↶ Undo</button>
  <button id="btn-redo" onclick="redoHistory()" title="Redo (Ctrl+Y)">↷ Redo</button>
  <div class="sep"></div>
  <button onclick="openSettings()">⚙ Settings</button>
  <button onclick="openExportPreview()" title="Preview the printable sheet, pick a page size, and export">🖨 Export / Preview</button>
  <button onclick="newProject()" title="Clear current sketch and start a new project (Ctrl+Z to recover)">🗋 New</button>
  <button onclick="saveJSON()" title="Save to the current file (Ctrl+S) — opens Save As if there is no file yet">Save</button>
  <button onclick="saveJSONAs()" title="Save under a new name; autosave follows the new file">Save As…</button>
  <button onclick="openRecentsModal()" title="Open from recent projects (stored in this browser)">📂 Recent</button>
  <label class="btn" id="load-label">Load
    <input type="file" id="load-json" accept=".json" style="display:none">
  </label>
  <span id="autosave-chip" class="autosave-chip"></span>
</header>

<div id="floor-bar">
  <span>Floor:</span>
  <div class="ft-tabs" id="floor-tabs"></div>
  <button class="small-btn" onclick="addFloor()">+ Floor</button>
  <button class="small-btn" onclick="renameFloor()">Rename</button>
  <button class="small-btn" onclick="removeFloor()">Delete Floor</button>
  <label style="display:flex; align-items:center; gap:6px; margin-left:16px; font-size:11px; color:#444;" title="Size of the dimension, area, and note labels on the drawing">
    Label size:
    <input type="range" id="sketch-font-bar" min="0.6" max="2" step="0.1" style="width:120px;">
    <span id="sketch-font-bar-val" style="font-family:monospace; min-width:34px; text-align:right;"></span>
  </label>
  <label style="display:flex; align-items:center; gap:6px; margin-left:16px; font-size:11px; color:#444;" title="Subject / project name — appears as the title on SVG/PNG exports">
    Subject:
    <input type="text" id="subject-input" placeholder="e.g. 113 7th Ave, Nakusp" style="width:240px; font-size:12px; padding:3px 6px;">
  </label>
  <span style="margin-left:auto;color:#666;font-size:11px;" id="floor-help"></span>
</div>

<main>
  <div id="canvas-wrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <aside id="sidebar"></aside>
</main>

<!-- Modal containers -->
<div id="modal-host"></div>

<script>
// =============================================================================
// Configuration, parsing, geometry, and edit-op helpers live in core.js
// (loaded via <script src="core.js"> in <head> above). They expose: TYPES,
// DIR_BASE, SETTINGS_DEFAULTS, HISTORY_LIMIT, EXPORT_PAGE_SIZES, parseLength,
// parseSegment, headingDeg, formatLength, formatGapBreakdown, pathPoints,
// polygonArea, polygonCentroid, wallVector/Length/Unit, findOpposingWall,
// rebuildSegments, syncClosure, setWallLength, moveWallByVector,
// moveVertexByVector, insertVertexOnWall, deleteVertex, findAlignedCandidates.
// =============================================================================

// =============================================================================
// STATE
// =============================================================================
let state = {
  segments: [],         // in-progress walking segments
  shapes: [],           // completed shapes (each: {id, points, segments, label, type, floor})
  floors: ['basement','main','upper','other'],
  activeFloor: 'main',
  selection: null,      // {kind:'wall'|'vertex'|'shape', shapeId, idx?}
  splitSelection: null, // {shapeId, idx} for first vertex in split
  mode: 'walk',         // 'walk' | 'edit' | 'split'
  nextShapeId: 1,
  startPoint: null,     // origin of current walk; null = (0,0)
  preview: null,        // walk-mode auto-extend preview: { dir, candIdx, candidates: [{along, point, segment}] }
  splitPreview: null,   // split-mode projection preview: { shapeId, originIdx, dir, hit: {wallIdx, point, distance} }
  undoStack: [],
  redoStack: [],
  annotations: [],      // [{ a:{x,y}, b:{x,y} }] — offset measurement labels between two points
  basements: {},        // { [building]: { areaOverride: number|null, pctFinished: number } } — declared below-grade area
  labels: [],           // [{ id, x, y, text, floor }] — free-text labels in WORLD coords
  nextLabelId: 1,
  selectedLabel: null,  // id of the currently selected free-text label (Text mode)
  labelDrag: null,      // transient: { id, grabX, grabY, moved } while dragging a label
  shapeLabelDrag: null, // transient: while dragging a shape's area/centroid label
  dimLabelDrag: null,   // transient: while dragging a wall's dimension label
  shapeMovePick: null,  // transient: { shapeId, anchor } while moving a shape by picking anchor -> destination
  rewalk: null,         // { original } while a shape is reopened as a walk (Re-walk this wall); closeShape re-applies its attributes
  offsetPick: null,     // null | { first: {x,y}|null } — active picking state for offset tool
  fenceDraw: null,      // null | { start:{x,y}, end:{x,y} } in WORLD coords while dragging
  fenceSelection: null, // null | { shapeVerts:[{shapeId,idx}], inProgVerts:[idx], annEnds:[{idx,end}] }
  subject: '',          // project/property name shown as title on exports
  subtitle: '',         // optional secondary line under the title
  settings: { ...SETTINGS_DEFAULTS },
};

let viewTransform = null; // { tx, ty, scale } from latest fitView, used for screen↔world

function snapshotState() {
  return JSON.stringify({
    segments: state.segments,
    shapes: state.shapes,
    floors: state.floors,
    activeFloor: state.activeFloor,
    nextShapeId: state.nextShapeId,
    startPoint: state.startPoint,
    annotations: state.annotations,
    basements: state.basements,
    labels: state.labels,
    nextLabelId: state.nextLabelId,
  });
}
function restoreState(snap) {
  const d = JSON.parse(snap);
  // Keep the selection across undo/redo when it still points at something real.
  const keep = state.selection;
  const keepSh = keep && d.shapes.find(s => s.id === keep.shapeId);
  const keepOk = !!keepSh && (keep.kind === 'shape' || (keep.idx != null && keep.idx < keepSh.points.length - 1));
  state.segments = d.segments;
  state.shapes = d.shapes;
  state.floors = d.floors;
  state.activeFloor = d.activeFloor;
  state.nextShapeId = d.nextShapeId;
  state.startPoint = d.startPoint;
  state.annotations = d.annotations || [];
  state.basements = d.basements || {};
  state.labels = d.labels || [];
  state.nextLabelId = d.nextLabelId || 1;
  state.selection = keepOk ? keep : null;
  state.rewalk = null;
  state.selectedLabel = null;
  state.labelDrag = null;
  state.shapeLabelDrag = null; state.dimLabelDrag = null; state.shapeMovePick = null;
  state.fenceSelection = null;
  state.fenceDraw = null;
  state.splitSelection = null;
}

// ----- Session autosave / crash recovery (localStorage-backed) --------------
// Mirrors the working sketch to localStorage so a reload, tab-close, or crash
// (e.g. an accidental Ctrl+R) doesn't lose in-progress work. The slot always
// reflects the latest state, so startup silently restores exactly where you left
// off — no prompt. Separate from the named "recent projects" store.
const AUTOSAVE_KEY = 'cvalrsketch:autosave';
let _autosaveTimer = null;
function writeAutosave() {
  try { localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({ at: Date.now(), snap: snapshotState(), subject: state.subject, subtitle: state.subtitle })); }
  catch (e) { /* quota / private mode — non-fatal */ }
}
function scheduleAutosave() {
  scheduleFileAutosave();                // file autosave rides the same change signal
  if (_autosaveTimer) return;            // coalesce bursts of renders into one write
  _autosaveTimer = setTimeout(() => { _autosaveTimer = null; writeAutosave(); }, 800);
}
function autoRestoreSession() {
  let saved;
  try { saved = JSON.parse(localStorage.getItem(AUTOSAVE_KEY) || 'null'); } catch (e) { return; }
  if (!saved || !saved.snap) return;
  try {
    restoreState(saved.snap);            // restoreState resets transient UI fields itself
    // Title fields live outside the undo snapshot, so carry them separately.
    if (typeof saved.subject === 'string') state.subject = saved.subject;
    if (typeof saved.subtitle === 'string') state.subtitle = saved.subtitle;
    const subjInp = document.getElementById('subject-input');
    if (subjInp) subjInp.value = state.subject || '';
  }
  catch (e) { /* corrupt slot — ignore and start fresh */ }
}

// ----- File autosave (File System Access API — Chrome / Edge) ----------------
// After a Save As, or a Load through the file picker, we keep the file's handle
// and rewrite the file a moment after every change, so the JSON in the workfile
// is always current. The handle is remembered in IndexedDB so the next visit can
// offer "resume" — the browser insists on one click to re-grant write access.
// Session autosave (above) stays independent: that is the crash net, this is the file.
const FILE_AUTOSAVE_DEBOUNCE_MS = 2000;
const fileAutosaveSupported = !!(window.showSaveFilePicker && window.showOpenFilePicker);
const fileAutosave = { handle: null, name: '', status: 'off', lastAt: null, lastPayload: null, timer: null, writing: false };

// What Save writes and what autosave keeps current. Undo history and transient UI
// state are per-session and deliberately left out of the file.
function serializeProject() {
  const data = { ...state };
  ['undoStack', 'redoStack', 'selection', 'splitSelection', 'preview', 'splitPreview',
   'selectedLabel', 'labelDrag', 'shapeLabelDrag', 'dimLabelDrag', 'shapeMovePick', 'rewalk', 'offsetPick', 'fenceDraw', 'fenceSelection']
    .forEach(k => delete data[k]);
  return JSON.stringify(data, null, 2);
}

function setFileHandle(handle) {
  fileAutosave.handle = handle;
  fileAutosave.name = handle ? handle.name : '';
  fileAutosave.status = handle ? 'armed' : 'off';
  fileAutosave.lastAt = null;
  fileAutosave.lastPayload = null;
  idbSet('fileHandle', handle || null);
  renderAutosaveChip();
}
function dropFileHandle() { if (fileAutosave.handle) setFileHandle(null); }

function scheduleFileAutosave() {
  if (!fileAutosave.handle || !state.settings.autosaveToFile) return;
  if (fileAutosave.status === 'paused' || fileAutosave.timer) return;
  fileAutosave.timer = setTimeout(() => { fileAutosave.timer = null; writeFileAutosave(); }, FILE_AUTOSAVE_DEBOUNCE_MS);
}
async function writeFileAutosave(force) {
  const h = fileAutosave.handle;
  if (!h) return false;
  const payload = serializeProject();
  if (!force && payload === fileAutosave.lastPayload) return true;   // nothing changed since the last write
  if (fileAutosave.writing) { scheduleFileAutosave(); return false; } // a write is in flight; go again after it
  fileAutosave.writing = true;
  fileAutosave.status = 'saving'; renderAutosaveChip();
  try {
    const w = await h.createWritable();
    await w.write(payload);
    await w.close();
    fileAutosave.lastPayload = payload;
    fileAutosave.lastAt = Date.now();
    fileAutosave.status = 'saved';
    return true;
  } catch (e) {
    // Permission lapses (new browser session, revoked grant) pause rather than fail.
    fileAutosave.status = (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) ? 'paused' : 'error';
    console.warn('File autosave failed:', e);
    return false;
  } finally {
    fileAutosave.writing = false;
    renderAutosaveChip();
  }
}
// Re-grant write access to the remembered file (must run from a click) and resume.
async function resumeFileAutosave() {
  const h = fileAutosave.handle;
  if (!h) return;
  try {
    const perm = await h.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') return;
    fileAutosave.status = 'armed';
    await writeFileAutosave(true);
  } catch (e) { fileAutosave.status = 'error'; renderAutosaveChip(); }
}
// On startup: pick the remembered handle back up. If the grant is still live (same
// browser session) autosave just carries on; otherwise the chip offers "resume".
async function restoreFileHandle() {
  if (!fileAutosaveSupported) { renderAutosaveChip(); return; }
  const h = await idbGet('fileHandle');
  if (h && typeof h.queryPermission === 'function') {
    fileAutosave.handle = h;
    fileAutosave.name = h.name;
    let perm = 'prompt';
    try { perm = await h.queryPermission({ mode: 'readwrite' }); } catch (e) { /* treat as prompt */ }
    fileAutosave.status = perm === 'granted' ? 'armed' : 'paused';
  }
  renderAutosaveChip();
}
function renderAutosaveChip() {
  const el = document.getElementById('autosave-chip');
  if (!el) return;
  const fa = fileAutosave;
  const at = fa.lastAt ? new Date(fa.lastAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
  let cls = '', txt = '', title = '';
  if (!fileAutosaveSupported) { txt = 'autosave n/a'; title = 'File autosave needs Chrome or Edge. Session autosave still protects against reloads.'; }
  else if (!state.settings.autosaveToFile) { txt = 'autosave off'; title = 'File autosave is turned off in Settings.'; }
  else if (!fa.handle) { txt = 'autosave: no file yet'; title = 'Save As… or Load a file to start autosaving to it.'; }
  else if (fa.status === 'paused') { cls = 'paused'; txt = `⏸ resume autosave → ${fa.name}`; title = 'Click to re-grant write access and resume autosaving to this file.'; }
  else if (fa.status === 'error') { cls = 'error'; txt = `⚠ autosave failed → ${fa.name}`; title = 'The last write failed. Click to retry.'; }
  else if (fa.status === 'saving') { cls = 'saving'; txt = `… saving ${fa.name}`; title = 'Writing…'; }
  else if (fa.status === 'saved') { cls = 'saved'; txt = `● autosaved ${fa.name} · ${at}`; title = `Last written ${at}. Each change is written about 2 s later.`; }
  else { cls = 'saved'; txt = `● autosaving → ${fa.name}`; title = 'Armed. The next change will be written to this file.'; }
  el.className = 'autosave-chip' + (cls ? ' ' + cls : '');
  el.textContent = txt;
  el.title = title;
}
document.getElementById('autosave-chip').addEventListener('click', () => {
  if (fileAutosave.status === 'paused') resumeFileAutosave();
  else if (fileAutosave.status === 'error') writeFileAutosave(true);
});

// Minimal IndexedDB key/value store — file handles survive a reload here, localStorage can't hold them.
function idbOpen() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error('no indexedDB'));
    const req = indexedDB.open('cvalrsketch', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, val) {
  try {
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(val, key);

  const tol = 1e-4;
  const cur = state.startPoint;
  const curVal = axis === 'x' ? cur.x : cur.y;
  const coords = [...new Set(verts.map(p => axis === 'x' ? p.x : p.y))].sort((a, b) => a - b);

// Cast a ray from `origin` in direction `dir` and return the closest forward hit on a wall of `shape`,
// skipping walls adjacent to the origin vertex (passed as `skipVertexIdx`).
function rayHitsWall(origin, dir, shape, skipVertexIdx) {
  const rad = DIR_BASE[dir] * Math.PI / 180;
  const Dx = Math.cos(rad), Dy = Math.sin(rad);
  const n = shape.points.length - 1; // wall count
  const adjA = skipVertexIdx;
  const adjB = (skipVertexIdx - 1 + n) % n;
  let best = null;
  for (let i = 0; i < n; i++) {
    if (i === adjA || i === adjB) continue;
    const a = shape.points[i], b = shape.points[i + 1];
    const wx = b.x - a.x, wy = b.y - a.y;
    const det = wx * Dy - Dx * wy;
    if (Math.abs(det) < 1e-9) continue;
    const aox = a.x - origin.x, aoy = a.y - origin.y;
    const t = (aoy * wx - aox * wy) / det;
    const u = (Dx * aoy - Dy * aox) / det;
    if (t > 0.001 && u >= -0.001 && u <= 1.001) {
      if (!best || t < best.t) {
        best = { wallIdx: i, point: { x: origin.x + t * Dx, y: origin.y + t * Dy }, distance: t, u };
      }
    }
  }
  return best;
}

    { ...pts[0] }

  // screen (the 80px pad below covers each label's height).

  const w = svg.clientWidth || 800, h = svg.clientHeight || 600;

  const xs = all.map(p=>p.x), ys = all.map(p=>p.y);
  const minX=Math.min(...xs), maxX=Math.max(...xs);
  const minY=Math.min(...ys), maxY=Math.max(...ys);

        const sign = ((mx - c.x)*nx + (my - c.y)*ny) > 0 ? 1 : -1;
        const ox = nx*sign, oy = ny*sign;   // outward unit normal
        // Text is always set horizontally. Beside a (near-)vertical wall, anchor its
        // near edge just off the wall instead of centring it on the offset point —
        // centred text straddles the wall line and runs into the neighbouring wall.
        const beside = Math.abs(ox) > Math.abs(oy);
        const gap = beside ? 6 : 12;
        const anchor = beside ? (ox > 0 ? 'start' : 'end') : 'middle';
        const autoX = mx + ox*gap, autoY = my + oy*gap;
        // Manual nudge (world feet) set by dragging the label in Edit mode.
        const man = sh.dimOffsets && sh.dimOffsets[i];
        const tx = autoX + (man ? man.dx * viewTransform.scale : 0);
        const ty = autoY + (man ? man.dy * viewTransform.scale : 0);
        const label = formatLength(sh.segments[i].length);
        // No ghost fade on dimensions: a surfaced floor's dims should read crisply.
        addEl('text', { x: tx, y: ty, 'text-anchor':anchor, 'dominant-baseline':'middle', 'font-size':skFont(11), 'font-weight':'bold', fill:'#0066cc' }, label);
        if (!isGhost && state.mode === 'edit') {
          // Drag handle over the label (ui-overlay → never exported). Double-click resets.
          const tw = label.length * skFont(11) * 0.62, th = skFont(11) + 6;
          const hx = anchor === 'start' ? tx : anchor === 'end' ? tx - tw : tx - tw/2;
          const hit = addEl('rect', { x: hx - 3, y: ty - th/2, width: tw + 6, height: th, fill: 'rgba(0,0,0,0)', class: 'ui-overlay dim-handle' });
          hit.style.cursor = 'move';
          hit.addEventListener('mousedown', (ev) => startDimLabelDrag(ev, sh.id, i, { x: autoX, y: autoY }));
          hit.addEventListener('dblclick', (ev) => { ev.stopPropagation(); resetDimLabel(sh.id, i); });
        }
      }
    }
  }

  // Vertices: dots visible on non-ghost (per settings/mode), and on ghosts when picking start.
  // Hit areas: in edit/split (non-ghost only), and in walk mode for picking start (all shapes).
  const movePicking = !!state.shapeMovePick;   // move-by-picking: every vertex, ghosts included, is a candidate
  const showDots = !isGhost ? (state.settings.showVertexDots || state.mode !== 'walk' || canSnapTo) : (canPickStart || movePicking);
  const addHits = canPickStart || movePicking || (!isGhost && (canSnapTo || state.mode === 'edit' || state.mode === 'split'));
  if (showDots || addHits) {
    for (let i = 0; i < sh.points.length - 1; i++) {
      const p = screenPts[i];
      const isSel = !isGhost && state.selection && state.selection.kind === 'vertex' && state.selection.shapeId === sh.id && state.selection.idx === i;
      const isSplitPicked = !isGhost && state.splitSelection && state.splitSelection.shapeId === sh.id && state.splitSelection.idx === i;
      if (showDots) {
        const mp = state.shapeMovePick;
        const isAnchor = !!(mp && mp.anchor && sh.id === mp.shapeId && Math.abs(sh.points[i].x - mp.anchor.x) < 1e-9 && Math.abs(sh.points[i].y - mp.anchor.y) < 1e-9);
        const dotClass = 'visible-vertex' + (isSel || isSplitPicked || isAnchor ? ' selected' : '') + (canPickStart || canSnapTo || movePicking ? ' pickable' : '');
        addEl('circle', { cx: p.x, cy: p.y, r: canPickStart ? 5 : 4, class: dotClass });
      }
      if (addHits) {
        const hit = addEl('circle', { cx: p.x, cy: p.y, r: 12, class: 'hit-vertex' });
        hit.addEventListener('click', (ev) => {
          ev.stopPropagation();
          if (state.shapeMovePick) { handleShapeMovePick(sh, i); return; }
          if (state.offsetPick) { handleOffsetPick(sh.points[i]); return; }
          if (canPickStart) setStartPoint(sh.points[i]);
          else if (canSnapTo) snapWalkToPoint(sh.points[i]);
          else if (state.mode === 'split') handleSplitClick(sh.id, i);
          else { state.selection = { kind:'vertex', shapeId: sh.id, idx: i }; render(); }
        });
      }
    }
  }

  // Centroid label (shown for ghosts too, just faded). White halo keeps it legible
  // over walls/dimension labels; draggable in Edit mode via per-shape labelOffset.
  if (state.settings.showCentroidLabels) {
    const base = polygonCentroid(sh.points);
    const off = sh.labelOffset || { dx: 0, dy: 0 };
    const c = W({ x: base.x + off.dx, y: base.y + off.dy });
    const area = polygonArea(sh.points);
    const halo = { stroke: 'white', 'stroke-width': 3.5, 'paint-order': 'stroke fill' };
    // Other-floor (ghost) labels render a touch smaller and in a muted blue-grey so
    // they stay distinguishable from the active floor's label even at high opacity.
    const nameSize = isGhost ? skFont(11.5) : skFont(14);
    const areaSize = isGhost ? skFont(9.5)  : skFont(11);
    const nameFill = isGhost ? '#5a6b80' : '#222';
    const areaFill = isGhost ? '#7c8a9c' : '#555';
    addEl('text', { x: c.x, y: c.y-7, 'text-anchor':'middle', 'font-size':nameSize, 'font-weight':'bold', fill:nameFill, ...halo, class: cls }, sh.label);
    addEl('text', { x: c.x, y: c.y+9, 'text-anchor':'middle', 'font-size':areaSize, fill:areaFill, ...halo, class: cls }, `${Math.round(area)} sq ft`);
    if (!isGhost && state.mode === 'edit') {
      const hw = Math.max(44, sh.label.length * 8);
      const hit = addEl('rect', { x: c.x - hw/2, y: c.y - 20, width: hw, height: 34, fill: 'rgba(0,0,0,0)', class: 'ui-overlay' });
      hit.style.cursor = 'move';
      hit.addEventListener('mousedown', (ev) => startShapeLabelDrag(ev, sh.id));
    }
  }
}

function renderInProgress(W) {
  const pts = pathPointsHere(state.segments).map(W);
  // Use M (move) instead of L (line) for jump segments so the wall path doesn't draw across them
  const d = pts.map((p,i) => {
    if (i === 0) return `M${p.x} ${p.y}`;
    return (state.segments[i-1].jump ? 'M' : 'L') + p.x + ' ' + p.y;
  }).join(' ');
  addEl('path', { d, fill: 'none', stroke: '#2b6cb0', 'stroke-width': 2.5, 'stroke-dasharray': '5,3' });
  // Faint dotted overlay so jumps are visible (without looking like walls)
  const jumpD = state.segments.map((seg, i) => seg.jump
    ? `M${pts[i].x} ${pts[i].y} L${pts[i+1].x} ${pts[i+1].y}` : null
  ).filter(Boolean).join(' ');
  if (jumpD) addEl('path', { d: jumpD, fill: 'none', stroke: '#aaa', 'stroke-width': 1.2, 'stroke-dasharray': '2,4' });
  const start = pts[0];
  addEl('circle', { cx: start.x, cy: start.y, r: 5, fill: '#2e8b57' });
  const pen = pts[pts.length-1];
  addEl('circle', { cx: pen.x, cy: pen.y, r: 6, fill: '#c44' });
  if (state.settings.showSegmentLabels) {
    state.segments.forEach((seg,i) => {
      if (seg.jump) return;
      const a = pts[i], b = pts[i+1];
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      const dx=b.x-a.x, dy=b.y-a.y;
      const len = Math.hypot(dx,dy);
      if (len < 30) return;
      const nx=-dy/len, ny=dx/len;
      addEl('text', { x: mx+nx*10, y: my+ny*10, 'text-anchor':'middle', 'dominant-baseline':'middle', 'font-size':skFont(11), fill:'#2b6cb0' }, formatLength(seg.length));
    });
  }
  // Offset-tool picking: make every in-progress vertex clickable
  const wpts = pathPointsHere(state.segments);
  if (state.offsetPick) {
    wpts.forEach((wp, i) => {
      const sp = W(wp);
      const h = addEl('circle', { cx: sp.x, cy: sp.y, r: 12, class: 'hit-vertex ui-overlay' });
      h.addEventListener('click', (ev) => {
        ev.stopPropagation();
        handleOffsetPick(wp);
      });
    });
  } else if (state.mode === 'walk' && state.segments.length > 0) {
    // Click-to-snap: any walk vertex except the pen itself (clicking the start
    // draws the closing line straight back to it).
    wpts.forEach((wp, i) => {
      if (i === wpts.length - 1) return; // the pen — skip
      const sp = W(wp);
      const h = addEl('circle', { cx: sp.x, cy: sp.y, r: 12, class: 'hit-vertex ui-overlay' });
      h.addEventListener('click', (ev) => {
        ev.stopPropagation();
        snapWalkToPoint(wp);
      });
    });
  }
  // Gap indicator: dashed line from pen back to start, labeled with the directional offset
  const wStart = wpts[0];
  const wPen = wpts[wpts.length - 1];
  const gapDxW = wStart.x - wPen.x;
  const gapDyW = wStart.y - wPen.y;
  const gapLenW = Math.hypot(gapDxW, gapDyW);
  if (gapLenW > state.settings.autoCloseFeet) {
    addEl('path', {
      d: `M${pen.x} ${pen.y} L${start.x} ${start.y}`,
      fill: 'none', stroke: '#e57c00', 'stroke-width': 1.5, 'stroke-dasharray': '4,4'
    });
    const mx = (pen.x + start.x) / 2;
    const my = (pen.y + start.y) / 2;
    const sdx = start.x - pen.x, sdy = start.y - pen.y;
    const slen = Math.hypot(sdx, sdy) || 1;
    const nx = -sdy / slen, ny = sdx / slen;
    const label = `OFFSET ${formatLength(gapLenW)} (${formatGapBreakdown(gapDxW, gapDyW)})`;
    addEl('text', {
      x: mx + nx * 14, y: my + ny * 14,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      'font-size': 12, 'font-weight': 'bold', fill: '#e57c00',
      stroke: 'white', 'stroke-width': 3, 'paint-order': 'stroke fill'
    }, label);
  }
}

// =============================================================================
// SIDEBAR
// =============================================================================
function renderSidebar() {
  const aside = document.getElementById('sidebar');
  // The sidebar is rebuilt from scratch on every render, which replaces the
  // element that had keyboard focus. Remember it by id and hand focus back, so
  // e.g. the walk input keeps the caret through a preview/accept/undo cycle.
  const active = document.activeElement;
  const refocusId = (active && active.id && aside.contains(active)) ? active.id : null;
  let html = '';
  if (state.mode === 'walk') html += sidebarWalk();
  if (state.mode === 'edit') html += sidebarEdit();
  if (state.mode === 'split') html += sidebarSplit();
  if (state.mode === 'fence') html += sidebarFence();
  if (state.mode === 'text') html += sidebarText();
  html += sidebarOffsets();
  html += sidebarShapes() + sidebarBasement() + sidebarTotals();
  aside.innerHTML = html;
  attachSidebarHandlers();
  if (refocusId) {
    const el = document.getElementById(refocusId);
    if (el && typeof el.focus === 'function') {
      el.focus();
      if (typeof el.setSelectionRange === 'function' && typeof el.value === 'string') {
        try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { /* not a text field */ }
      }
    }
  }
}

function sidebarText() {
  const labels = labelsOnFloor(state.activeFloor);
  const list = labels.length
    ? labels.map(l => {
        const sel = state.selectedLabel === l.id ? ' style="background:#eaf2fb;"' : '';
        const preview = escapeHtml(l.text).replace(/\n/g, ' / ');
        const tag = l.headingFirst ? ' <span style="color:#888; font-size:10px;">(heading)</span>' : '';
        return `<div class="seg-item"${sel}>
          <span data-act="selectLabel" data-id="${l.id}" style="cursor:pointer; flex:1;">${preview}${tag}</span>
          <button data-act="editLabel" data-id="${l.id}" title="Edit">✎</button>
          <button data-act="deleteLabel" data-id="${l.id}" title="Delete">×</button>
        </div>`;
      }).join('')
    : '<div class="help">No labels on this floor yet.</div>';
  return `
    <div class="section">
      <h2>Text Labels</h2>
      <div class="help">Click a blank spot on the canvas to add a label. Click a label to select, drag to move, double-click to edit. Delete key removes the selected label. Labels can span multiple lines, and the first line can be styled as a larger heading.</div>
      <div style="margin-top:8px;">${list}</div>
    </div>`;
}

function renderFence(W) {
  if (state.fenceDraw) {
    const a = W(state.fenceDraw.start), b = W(state.fenceDraw.end);
    const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
    const w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
    addEl('rect', { x, y, width: w, height: h, fill: 'rgba(43,108,176,0.08)', stroke: '#2b6cb0', 'stroke-width': 1.5, 'stroke-dasharray': '4,3', class: 'ui-overlay' });
  }
  if (state.fenceSelection) {
    const dot = (sx, sy) => addEl('circle', { cx: sx, cy: sy, r: 6, fill: 'none', stroke: '#2b6cb0', 'stroke-width': 2, class: 'ui-overlay' });
    state.fenceSelection.shapeVerts.forEach(({ shapeId, idx }) => {
      const sh = state.shapes.find(s => s.id === shapeId);
      if (!sh) return;
      const p = W(sh.points[idx]);
      dot(p.x, p.y);
    });
    if (state.segments.length) {
      const wpts = pathPointsHere(state.segments);
      state.fenceSelection.inProgVerts.forEach(i => {
        const p = W(wpts[i]);
        dot(p.x, p.y);
      });
    }
    state.fenceSelection.annEnds.forEach(({ idx, end }) => {
      const ann = state.annotations[idx];
      if (!ann) return;
      const p = W(ann[end]);
      dot(p.x, p.y);
    });
  }
}

function screenToWorld(clientX, clientY) {
  if (!viewTransform) return { x: 0, y: 0 };
  const rect = svg.getBoundingClientRect();
  const vbW = svg.viewBox.baseVal.width || rect.width;
  const vbH = svg.viewBox.baseVal.height || rect.height;
  const sx = (clientX - rect.left) * (vbW / rect.width);
  const sy = (clientY - rect.top) * (vbH / rect.height);
  return { x: (sx - viewTransform.tx) / viewTransform.scale, y: (sy - viewTransform.ty) / viewTransform.scale };
}

function fenceMouseDown(e) {
  if (state.mode !== 'fence') return;
  if (e.button !== 0) return;
  const p = screenToWorld(e.clientX, e.clientY);
  state.fenceDraw = { start: p, end: p };
  e.preventDefault();
}
function fenceMouseMove(e) {
  if (!state.fenceDraw) return;
  state.fenceDraw.end = screenToWorld(e.clientX, e.clientY);
  render();
}
function fenceMouseUp(e) {
  if (!state.fenceDraw) return;
  const d = state.fenceDraw;
  const minDx = Math.abs(d.end.x - d.start.x);
  const minDy = Math.abs(d.end.y - d.start.y);
  state.fenceDraw = null;
  if (minDx < 0.05 && minDy < 0.05) { render(); return; } // ignore stray clicks
  finalizeFenceSelection(d.start, d.end);
}

function finalizeFenceSelection(a, b) {
  const x1 = Math.min(a.x, b.x), x2 = Math.max(a.x, b.x);
  const y1 = Math.min(a.y, b.y), y2 = Math.max(a.y, b.y);
  const inside = p => p.x >= x1 && p.x <= x2 && p.y >= y1 && p.y <= y2;
  const sel = { shapeVerts: [], inProgVerts: [], annEnds: [] };
  // Closed shapes on active floor (skip the duplicate closing vertex)
  shapesOnFloor(state.activeFloor).forEach(sh => {
    for (let i = 0; i < sh.points.length - 1; i++) {
      if (inside(sh.points[i])) sel.shapeVerts.push({ shapeId: sh.id, idx: i });
    }
  });
  // In-progress walk vertices
  if (state.segments.length) {
    pathPointsHere(state.segments).forEach((p, i) => {
      if (inside(p)) sel.inProgVerts.push(i);
    });
  }
  // Offset annotation endpoints
  state.annotations.forEach((ann, i) => {
    if (inside(ann.a)) sel.annEnds.push({ idx: i, end: 'a' });
    if (inside(ann.b)) sel.annEnds.push({ idx: i, end: 'b' });
  });
  state.fenceSelection = sel;
  render();
}

function clearFenceSelection() {
  state.fenceSelection = null;
  render();
}

function applyGroupMove() {
  const sel = state.fenceSelection;
  if (!sel) return;
  const total = sel.shapeVerts.length + sel.inProgVerts.length + sel.annEnds.length;
  if (!total) { alert('Fence selection is empty.'); return; }
  const input = document.getElementById('group-move');
  if (!input) return;
  const raw = input.value.trim();
  if (!raw) return;
  let seg;
  try { seg = parseSegment(raw); } catch (err) { alert(err.message); return; }
  if (seg.autoExtend) { alert('Provide a length and direction (e.g. 3\'6 r).'); return; }
  pushUndo();
  // Shape vertices
  const affectedShapes = new Set();
  sel.shapeVerts.forEach(({ shapeId, idx }) => {
    const sh = state.shapes.find(s => s.id === shapeId);
    if (!sh) return;
    sh.points[idx].x += seg.dx;
    sh.points[idx].y += seg.dy;
    syncClosure(sh, idx);
    affectedShapes.add(shapeId);
  });
  affectedShapes.forEach(id => {
    const sh = state.shapes.find(s => s.id === id);
    if (sh) rebuildSegments(sh);
  });
  // In-progress walk: shift selected points, then rebuild segments from new positions
  if (sel.inProgVerts.length && state.segments.length) {
    const wpts = pathPointsHere(state.segments).map(p => ({ x: p.x, y: p.y }));
    const idxSet = new Set(sel.inProgVerts);
    wpts.forEach((p, i) => { if (idxSet.has(i)) { p.x += seg.dx; p.y += seg.dy; } });
    if (idxSet.has(0)) state.startPoint = { x: wpts[0].x, y: wpts[0].y };
    state.segments.forEach((s, i) => {
      const dx = wpts[i+1].x - wpts[i].x;
      const dy = wpts[i+1].y - wpts[i].y;
      const length = Math.hypot(dx, dy);
      s.dx = dx; s.dy = dy; s.length = length;
      s.dir = Math.abs(dx) >= Math.abs(dy) ? (dx >= 0 ? 'r' : 'l') : (dy >= 0 ? 'd' : 'u');
      s.angle = 0;
      s.raw = `${formatLength(length)} ${s.dir} (adj)`;
    });
  }
  // Annotation endpoints
  sel.annEnds.forEach(({ idx, end }) => {
    state.annotations[idx][end].x += seg.dx;
    state.annotations[idx][end].y += seg.dy;
  });
  input.value = '';
  render();
}

function sidebarFence() {
  const sel = state.fenceSelection;
  const counts = sel
    ? `${sel.shapeVerts.length} shape vertex(es), ${sel.inProgVerts.length} in-progress vertex(es), ${sel.annEnds.length} annotation endpoint(s)`
    : '';
  const intro = state.fenceDraw
    ? 'Release to capture vertices inside the rectangle.'
    : (sel
        ? `Selected: <b>${counts}</b>. Walls with both endpoints captured will translate; walls crossing the fence stretch. Type an offset and press <b>Move</b>.`
        : 'Click and drag on the canvas to draw a rectangular fence. Vertices fully inside the rectangle will be captured.');
  const moveBlock = sel ? `
    <div class="input-row" style="margin-top:8px;">
      <input id="group-move" placeholder="e.g. 3'6 r  or  6&quot; d">
      <button data-act="applyGroupMove" class="primary">Move</button>
    </div>
    <div class="row-buttons" style="margin-top:6px;">
      <button data-act="clearFenceSelection" class="danger">Clear selection</button>
    </div>
  ` : '';
  return `
    <div class="section">
      <h2>Fence</h2>
      <div class="help">${intro}</div>
      ${moveBlock}
    </div>
  `;
}

function sidebarOffsets() {
  const picking = !!state.offsetPick;
  const pickHint = picking
    ? (state.offsetPick.first
        ? 'Click the <b>second vertex</b> to drop the offset label.'
        : 'Click the <b>first vertex</b> (any vertex of any shape, or the pen/start dot of an in-progress walk).')
    : 'Drop a labeled <b>offset measurement</b> between any two vertices on the canvas.';
  const button = picking
    ? '<button data-act="cancelOffsetPick" class="danger">Cancel pick</button>'
    : '<button data-act="startOffsetPick" class="primary">Measure offset</button>';
  const listHtml = state.annotations.length === 0
    ? '<div class="help" style="margin-top:6px;">No offsets yet.</div>'
    : state.annotations.map((ann, i) => {
        const dx = ann.b.x - ann.a.x, dy = ann.b.y - ann.a.y;
        const len = Math.hypot(dx, dy);
        return `<div class="seg-item"><span>${i+1}. ${formatLength(len)} (${formatGapBreakdown(dx, dy)})</span><button data-act="removeAnnotation" data-i="${i}" title="Remove">×</button></div>`;
      }).join('');
  const clearBtn = state.annotations.length
    ? '<div class="row-buttons" style="margin-top:6px;"><button data-act="clearAnnotations" class="danger">Clear all</button></div>'
    : '';
  return `
    <div class="section">
      <h2>Offset Measurements</h2>
      <div class="help">${pickHint}</div>
      <div class="row-buttons" style="margin-top:6px;">${button}</div>
      <div id="ann-list" style="margin-top:6px;">${listHtml}</div>
      ${clearBtn}
    </div>
  `;
}

function renderAnnotations(W) {
  // First-pick highlight (pulse-like ring) — UI-only, stripped from exports
  if (state.offsetPick && state.offsetPick.first) {
    const p = W(state.offsetPick.first);
    addEl('circle', { cx: p.x, cy: p.y, r: 9, fill: 'none', stroke: '#d946ef', 'stroke-width': 2, 'stroke-dasharray': '3,2', class: 'ui-overlay' });
  }
  state.annotations.forEach((ann) => {
    const aS = W(ann.a), bS = W(ann.b);
    addEl('path', {
      d: `M${aS.x} ${aS.y} L${bS.x} ${bS.y}`,
      fill: 'none', stroke: '#d946ef', 'stroke-width': 1.5, 'stroke-dasharray': '4,4'
    });
    addEl('circle', { cx: aS.x, cy: aS.y, r: 3, fill: '#d946ef' });
    addEl('circle', { cx: bS.x, cy: bS.y, r: 3, fill: '#d946ef' });
    const dx = ann.b.x - ann.a.x, dy = ann.b.y - ann.a.y;
    const len = Math.hypot(dx, dy);
    const breakdown = formatGapBreakdown(dx, dy);
    const mx = (aS.x + bS.x) / 2, my = (aS.y + bS.y) / 2;
    const sdx = bS.x - aS.x, sdy = bS.y - aS.y;
    const slen = Math.hypot(sdx, sdy) || 1;
    const nx = -sdy / slen, ny = sdx / slen;
    addEl('text', {
      x: mx + nx * 14, y: my + ny * 14,
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      'font-size': 12, 'font-weight': 'bold', fill: '#d946ef',
      stroke: 'white', 'stroke-width': 3, 'paint-order': 'stroke fill'
    }, `${formatLength(len)} (${breakdown})`);
  });
}

// Free-text labels (Text mode). Stored in world coords; rendered on top of shapes.
// The text itself is export content; only the selection box is a ui-overlay.
function labelsOnFloor(floor) {
  return state.labels.filter(l => (l.floor || 'main') === floor);
}
// Per-line style for a label: heading mode makes line 0 large+bold and the rest
// smaller; otherwise every line is uniform. Returns [{txt,size,weight,lh}].
function labelLineStyles(l) {
  const lines = String(l.text).split('\n');
  // Heading box unchecked → every line is standard small body text. Checked →
  // first line is the larger bold heading, the rest stay standard body text.
  const heading = { size: skFont(16), weight: 'bold', lh: skFont(21) };

function renderLabels(W) {
  const ns = 'http://www.w3.org/2000/svg';

  // the export dimension list) are shown display-only so e.g. an upper-floor note
  // appears on the main-floor sheet.
  const surfaced = state.settings.ghostDimFloors || [];
  const visible = state.labels.filter(l => {
    const f = l.floor || 'main';
    return f === state.activeFloor || surfaced.includes(f);
  });
  visible.forEach(l => {
    const onActiveFloor = (l.floor || 'main') === state.activeFloor;
    const editable = state.mode === 'text' && onActiveFloor;
    const s = W(l);
    const styled = labelLineStyles(l);
    const totalH = styled.reduce((a, ln) => a + ln.lh, 0);
    const top = s.y - totalH / 2;
    const isSel = editable && state.selectedLabel === l.id;
    if (isSel) {
      // Selection box behind the text (UI-only, stripped from exports)
      const approxW = Math.max(24, ...styled.map(ln => ln.txt.length * ln.size * 0.55));
      addEl('rect', {
        x: s.x - approxW/2 - 6, y: top - 4, width: approxW + 12, height: totalH + 8,
        rx: 4, fill: 'rgba(43,108,176,0.10)', stroke: '#2b6cb0',
        'stroke-width': 1.5, 'stroke-dasharray': '4,3', class: 'ui-overlay'
      });
    }
    const txt = document.createElementNS(ns, 'text');
    if (onActiveFloor) txt.classList.add('free-label');  // only active-floor notes stay clickable in Text mode
    txt.setAttribute('text-anchor', 'middle');
    let cy = top;
    styled.forEach(ln => {
      const ts = document.createElementNS(ns, 'tspan');
      ts.setAttribute('x', s.x);
      ts.setAttribute('y', cy + ln.lh * 0.75);
      ts.setAttribute('font-size', ln.size);
      ts.setAttribute('font-weight', ln.weight);
      ts.setAttribute('fill', '#222');
      ts.setAttribute('stroke', 'white');
      ts.setAttribute('stroke-width', 3);
      ts.setAttribute('paint-order', 'stroke fill');
      ts.textContent = ln.txt;
      txt.appendChild(ts);
      cy += ln.lh;
    });
    svg.appendChild(txt);
    if (editable) {
      txt.style.cursor = 'move';
      txt.addEventListener('mousedown', (ev) => startLabelDrag(ev, l.id));
      txt.addEventListener('dblclick', (ev) => { ev.stopPropagation(); editLabel(l.id); });
    } else {
      txt.style.pointerEvents = 'none';  // don't intercept clicks on shapes/walls behind
    }
  });
}

// Modal editor for a label: multi-line text (Enter = line break) + optional
// "first line is a heading" styling (bigger heading, smaller body lines).
function openLabelEditor(opts) {
  const existing = opts.id != null ? state.labels.find(l => l.id === opts.id) : null;
  const m = createModal();
  const div = document.createElement('div');
  div.className = 'modal';
  div.innerHTML = `
    <h3>${existing ? 'Edit label' : 'Add label'}</h3>
    <textarea id="label-text" rows="4" style="width:100%; box-sizing:border-box; font-size:14px; padding:6px; font-family:inherit;" placeholder="Type label text — press Enter for a new line">${existing ? escapeHtml(existing.text) : ''}</textarea>
    <label style="display:flex; align-items:center; gap:8px; margin-top:10px; font-size:13px; cursor:pointer;">
      <input type="checkbox" id="label-heading" ${existing && existing.headingFirst ? 'checked' : ''}>
      First line is a heading (larger, with smaller text below)
    </label>
    <div class="help" style="margin-top:6px;">Tip: Ctrl/⌘+Enter saves. Esc cancels.</div>
    <div class="modal-buttons">
      ${existing ? '<button class="danger" id="label-delete">Delete</button>' : ''}
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" id="label-save">Save</button>
    </div>`;
  m.appendChild(div);
  const ta = div.querySelector('#label-text');
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
  const save = () => {
    const text = ta.value.replace(/\r\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    const headingFirst = div.querySelector('#label-heading').checked;
    if (!text) { closeModal(); if (existing) deleteLabel(existing.id); return; }
    pushUndo();
    if (existing) { existing.text = text; existing.headingFirst = headingFirst; }
    else {
      const id = state.nextLabelId++;
      state.labels.push({ id, x: opts.world.x, y: opts.world.y, text, headingFirst, floor: state.activeFloor });
      state.selectedLabel = id;
    }
    closeModal();
    render();
  };
  div.querySelector('#label-save').addEventListener('click', save);
  const del = div.querySelector('#label-delete');
  if (del) del.addEventListener('click', () => { closeModal(); deleteLabel(existing.id); });
  ta.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); save(); }
    else if (ev.key === 'Escape') { ev.preventDefault(); closeModal(); }
  });
}
function deleteLabel(id) {
  if (!state.labels.some(l => l.id === id)) return;
  pushUndo();
  state.labels = state.labels.filter(l => l.id !== id);
  if (state.selectedLabel === id) state.selectedLabel = null;
  render();
}
function startLabelDrag(ev, id) {
  if (ev.button !== 0) return;
  ev.stopPropagation();
  ev.preventDefault();
  const l = state.labels.find(l => l.id === id);
  if (!l) return;
  const w = screenToWorld(ev.clientX, ev.clientY);
  state.labelDrag = { id, grabX: w.x - l.x, grabY: w.y - l.y, moved: false };
  // Only re-render when selection actually changes — re-rendering replaces the
  // text node and would break the dblclick-to-edit sequence on an already-selected label.
  if (state.selectedLabel !== id) { state.selectedLabel = id; render(); }
}
function labelDragMove(e) {
  if (!state.labelDrag) return;
  const l = state.labels.find(l => l.id === state.labelDrag.id);
  if (!l) { state.labelDrag = null; return; }
  // Snapshot once, on the first real movement, so a drag is a single undo step
  // and a plain select-click (no movement) doesn't touch undo/redo history.
  if (!state.labelDrag.moved) { pushUndo(); state.labelDrag.moved = true; }
  const w = screenToWorld(e.clientX, e.clientY);
  l.x = w.x - state.labelDrag.grabX;
  l.y = w.y - state.labelDrag.grabY;
  render();
}
function labelDragUp() {
  if (!state.labelDrag) return;
  state.labelDrag = null;
}

// Drag a shape's area/centroid label to a custom offset (Edit mode). Fixes labels
// that land in a concave notch or collide with dimension text.
function startShapeLabelDrag(ev, shapeId) {
  if (ev.button !== 0) return;
  ev.stopPropagation();
  ev.preventDefault();
  const sh = state.shapes.find(s => s.id === shapeId);
  if (!sh) return;
  const base = polygonCentroid(sh.points);
  const off = sh.labelOffset || { dx: 0, dy: 0 };
  const w = screenToWorld(ev.clientX, ev.clientY);
  state.shapeLabelDrag = { shapeId, grabX: w.x - (base.x + off.dx), grabY: w.y - (base.y + off.dy), moved: false };
}
function shapeLabelDragMove(e) {
  if (!state.shapeLabelDrag) return;
  const sh = state.shapes.find(s => s.id === state.shapeLabelDrag.shapeId);
  if (!sh) { state.shapeLabelDrag = null; state.dimLabelDrag = null; state.shapeMovePick = null; return; }
  if (!state.shapeLabelDrag.moved) { pushUndo(); state.shapeLabelDrag.moved = true; }
  const base = polygonCentroid(sh.points);

// Dimension labels: per-wall manual nudge, dragged in Edit mode. Stored on the shape

// Copy-on-write, so a copied shape never shares the object with its source.
function startDimLabelDrag(ev, shapeId, idx, autoScreen) {
  if (ev.button !== 0) return;
  ev.stopPropagation();
  ev.preventDefault();
  const sh = state.shapes.find(s => s.id === shapeId);
  if (!sh) return;
  const v = viewTransform;
  const auto = { x: (autoScreen.x - v.tx) / v.scale, y: (autoScreen.y - v.ty) / v.scale };
  const off = (sh.dimOffsets && sh.dimOffsets[idx]) || { dx: 0, dy: 0 };
  const w = screenToWorld(ev.clientX, ev.clientY);
  state.dimLabelDrag = { shapeId, idx, auto, grabX: w.x - (auto.x + off.dx), grabY: w.y - (auto.y + off.dy), moved: false };

  const d = state.dimLabelDrag;
  if (!d) return;
  const sh = state.shapes.find(s => s.id === d.shapeId);
  if (!sh) { state.dimLabelDrag = null; return; }
  if (!d.moved) { pushUndo(); d.moved = true; }
  const w = screenToWorld(e.clientX, e.clientY);
  const dx = (w.x - d.grabX) - d.auto.x, dy = (w.y - d.grabY) - d.auto.y;
  if (!isFinite(dx) || !isFinite(dy)) return;   // bad pointer sample (e.g. zero-size layout) — never persist NaN

  if (!sh || !sh.dimOffsets || !sh.dimOffsets[idx]) return;
  pushUndo();
  const o = { ...sh.dimOffsets }; delete o[idx];
  sh.dimOffsets = Object.keys(o).length ? o : undefined;
  render();
}

// ----- Above/below-grade area helpers (appraisal reporting) -----
const ABOVE_GRADE_FLOORS = ['main', 'upper'];
const AGLA_TYPES = ['living', 'upper'];   // Enclosed living + Upper floor area

function buildingsPresent() {
  return [...new Set(state.shapes.map(sh => sh.building || DEFAULT_BUILDING))];
}
// Main-floor footprint = enclosed living on the 'main' floor (the basement's footprint by default).
function mainFloorFootprint(building) {
  return state.shapes
    .filter(sh => (sh.building || DEFAULT_BUILDING) === building && sh.floor === 'main' && sh.type === 'living')
    .reduce((a, sh) => a + polygonArea(sh.points), 0);
}
function aboveGradeLiving(building) {
  return state.shapes
    .filter(sh => (sh.building || DEFAULT_BUILDING) === building
      && ABOVE_GRADE_FLOORS.includes(sh.floor) && AGLA_TYPES.includes(sh.type))
    .reduce((a, sh) => a + polygonArea(sh.points), 0);
}
function basementArea(building) {
  const b = state.basements[building];
  if (b && b.areaOverride != null) return b.areaOverride;
  return mainFloorFootprint(building);
}
function toggleBasement(b, on) {
  pushUndo();
  if (on) state.basements[b] = state.basements[b] || { areaOverride: null, pctFinished: 100 };
  else delete state.basements[b];
  render();
}
function setBasementArea(b, val) {
  const bm = state.basements[b]; if (!bm) return;
  pushUndo();
  const n = parseFloat(val);
  bm.areaOverride = (String(val).trim() === '' || isNaN(n)) ? null : Math.max(0, n);
  render();
}
function setBasementPct(b, val) {
  const bm = state.basements[b]; if (!bm) return;
  pushUndo();
  let n = parseFloat(val); if (isNaN(n)) n = 0;
  bm.pctFinished = Math.max(0, Math.min(100, n));
  render();
}

function sidebarBasement() {
  const buildings = buildingsPresent();
  if (buildings.length === 0) return '';
  let html = '<div class="section"><h2>Basement (below grade)</h2>';
  buildings.forEach(b => {
    const bm = state.basements[b];
    const enabled = !!bm;
    const auto = Math.round(mainFloorFootprint(b));
    html += `<div style="padding:6px 0; border-bottom:1px solid #eee;">
      <label style="display:flex; align-items:center; gap:8px; font-size:12px; font-weight:bold; cursor:pointer;">
        <input type="checkbox" onchange="toggleBasement('${b}', this.checked)" ${enabled ? 'checked' : ''}> ${escapeHtml(b)}</label>`;
    if (enabled) {
      const area = Math.round(basementArea(b));
      const pct = bm.pctFinished;
      const fin = Math.round(area * pct / 100);
      const unf = Math.round(area - area * pct / 100);
      const areaVal = bm.areaOverride != null ? Math.round(bm.areaOverride) : '';
      html += `
        <div class="field"><label style="flex:1;">Area (sf)</label>
          <input type="number" style="width:90px;" value="${areaVal}" placeholder="auto ${auto}"
            onchange="setBasementArea('${b}', this.value)"></div>
        <div class="field"><label style="flex:1;">% finished</label>
          <input type="number" min="0" max="100" style="width:90px;" value="${pct}"
            onchange="setBasementPct('${b}', this.value)"></div>
        <div class="help">Footprint <b>${area} sf</b> → Finished <b>${fin} sf</b> · Unfinished <b>${unf} sf</b>.
          ${bm.areaOverride == null ? `Auto from main-floor enclosed living (${auto} sf).` : 'Manual override — clear the field to auto-use the main-floor footprint.'}</div>`;
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function sidebarTotals() {
  if (state.shapes.length === 0) return '';
  // Totals grouped Building → Floor → Type
  let html = '<div class="section"><h2>Totals (all buildings)</h2><div id="totals">';
  const byBuilding = {};
  state.shapes.forEach(sh => {
    const b = sh.building || DEFAULT_BUILDING;
    if (!byBuilding[b]) byBuilding[b] = {};
    if (!byBuilding[b][sh.floor]) byBuilding[b][sh.floor] = {};
    byBuilding[b][sh.floor][sh.type] = (byBuilding[b][sh.floor][sh.type] || 0) + polygonArea(sh.points);
  });
  Object.entries(byBuilding).forEach(([building, floors]) => {
    html += `<div style="margin-top:8px;font-weight:bold;font-size:12px;color:#2b3a4a;border-bottom:1px solid #ddd;">${escapeHtml(building)}</div>`;
    let buildingTotal = 0;
    Object.entries(floors).forEach(([floor, types]) => {
      html += `<div style="margin-top:4px;font-weight:bold;font-size:11px;color:#555;">&nbsp;&nbsp;${floor}</div>`;
      let floorTotal = 0;
      Object.entries(types).forEach(([k,v]) => {
        html += `<div class="row"><span>&nbsp;&nbsp;&nbsp;&nbsp;${TYPES[k]?TYPES[k].name:k}</span><span>${Math.round(v)} sf</span></div>`;
        floorTotal += v;
      });
      html += `<div class="row total"><span>&nbsp;&nbsp;&nbsp;&nbsp;Floor total</span><span>${Math.round(floorTotal)} sf</span></div>`;
      buildingTotal += floorTotal;
    });
    html += `<div class="row total"><span>&nbsp;&nbsp;${escapeHtml(building)} total</span><span>${Math.round(buildingTotal)} sf</span></div>`;

    // Above / below grade living-area summary (appraisal reporting)
    const agla = aboveGradeLiving(building);
    const bm = state.basements[building];
    if (agla > 0 || bm) {
      html += `<div style="margin-top:4px; padding-top:4px; border-top:1px dashed #bbb;"></div>`;
      html += `<div class="row total"><span>&nbsp;&nbsp;Above-Grade Living Area</span><span>${Math.round(agla)} sf</span></div>`;
      if (bm) {
        const area = basementArea(building);
        const fin = area * bm.pctFinished / 100;
        html += `<div class="row"><span>&nbsp;&nbsp;Below-Grade (basement)</span><span>${Math.round(area)} sf</span></div>`;
        html += `<div class="row"><span>&nbsp;&nbsp;&nbsp;&nbsp;Finished (${Math.round(bm.pctFinished)}%)</span><span>${Math.round(fin)} sf</span></div>`;
        html += `<div class="row"><span>&nbsp;&nbsp;&nbsp;&nbsp;Unfinished</span><span>${Math.round(area - fin)} sf</span></div>`;
      }
    }
  });
  html += '</div></div>';
  return html;
}

// =============================================================================
// SIDEBAR HANDLERS
// =============================================================================
function attachSidebarHandlers() {
  document.querySelectorAll('#sidebar [data-act]').forEach(el => {
    el.addEventListener('click', sidebarAction);
  });
  const cmd = document.getElementById('cmd');
  const ARROW_DIR = { ArrowRight: 'r', ArrowLeft: 'l', ArrowUp: 'u', ArrowDown: 'd' };
  if (cmd) cmd.addEventListener('keydown', e => {
    if (e.key === 'Enter') addCmd();
    else if (e.key === 'Escape') { cancelWalkPreview(); cmd.value = ''; }
    else if (e.key in ARROW_DIR && cmd.value === '') {
      // Empty input + arrow key → preview/cycle next aligned vertex as a pen-jump (no wall)
      e.preventDefault();
      handleAutoExtendKey(ARROW_DIR[e.key], /*asJump=*/true);
    }
  });
  const off = document.getElementById('start-offset');
  if (off) off.addEventListener('keydown', e => { if (e.key === 'Enter') offsetStart(); });
  const sdir = document.getElementById('split-dir');
  if (sdir) sdir.addEventListener('keydown', e => {
    if (e.key === 'Enter') splitProject();
    else if (e.key === 'Escape') { cancelSplitProject(); sdir.value = ''; }
  });
  if (window.Dictation && typeof Dictation.init === 'function') Dictation.init();
}

function sidebarAction(e) {
  const act = e.currentTarget.dataset.act;
  const i = e.currentTarget.dataset.i;
  const id = e.currentTarget.dataset.id;
  switch (act) {
    case 'addCmd': addCmd(); break;
    case 'undo': undoHistory(); break;
    case 'closeShape': closeShape(); break;
    case 'cancelShape': cancelShape(); break;
    case 'removeSeg': pushUndo(); state.segments.splice(parseInt(i),1); render(); break;
    case 'applyLen': applyLengthEdit(); break;
    case 'moveWall': moveSelectedWall(); break;
    case 'insertVertex': insertVertexAction(); break;
    case 'deleteWall': deleteWallAction(); break;
    case 'rewalkWall': rewalkSelectedWall(); break;
    case 'moveVertex': moveSelectedVertex(); break;
    case 'deleteVertex': deleteSelectedVertex(); break;
    case 'applyShape': applyShapeEdit(); break;
    case 'deleteShape': deleteSelectedShape(); break;
    case 'copyShape': copySelectedShape(); break;
    case 'moveShape': moveSelectedShapeByOffset(); break;
    case 'startShapeMovePick': startShapeMovePick(); break;
    case 'cancelShapeMovePick': cancelShapeMovePick(); break;
    case 'selectShape': state.mode='edit'; state.selection = {kind:'shape', shapeId: parseInt(id)}; render(); break;
    case 'editShape': state.mode='edit'; state.selection = {kind:'shape', shapeId: parseInt(id)}; render(); break;
    case 'deleteShapeById': deleteShapeById(parseInt(id)); break;
    case 'cancelSplit': state.splitSelection = null; state.splitPreview = null; state.mode='edit'; render(); break;
    case 'resetStart': resetStart(); break;
    case 'offsetStart': offsetStart(); break;
    case 'startOffsetPick': startOffsetPick(); break;
    case 'cancelOffsetPick': cancelOffsetPick(); break;
    case 'removeAnnotation': removeAnnotation(parseInt(i)); break;
    case 'clearAnnotations': clearAnnotations(); break;
    case 'applyGroupMove': applyGroupMove(); break;
    case 'clearFenceSelection': clearFenceSelection(); break;
    case 'commitPreview': commitWalkPreview(); break;
    case 'cancelPreview': cancelWalkPreview(); break;
    case 'selectLabel': state.selectedLabel = parseInt(id); render(); break;
    case 'editLabel': editLabel(parseInt(id)); break;
    case 'deleteLabel': deleteLabel(parseInt(id)); break;
    case 'splitProject': splitProject(); break;
    case 'confirmSplitProject': confirmSplitProject(); break;
    case 'cancelSplitProject': cancelSplitProject(); break;
  }
}

function applyLengthEdit() {
  const sel = state.selection;
  if (!sel || sel.kind !== 'wall') return;
  const sh = state.shapes.find(s => s.id === sel.shapeId);
  if (!sh) return;
  const newLen = parseLength(document.getElementById('edit-len').value);
  if (!(newLen > 0)) { alert('Invalid length'); return; }
  const mode = document.getElementById('edit-mode').value;

  if (state.settings.askOnLengthEdit) {
    showLengthEditDialog(sh, sel.idx, newLen, mode);
  } else {
    pushUndo();
    setWallLength(sh, sel.idx, newLen, mode);
    render();
  }
}

function showLengthEditDialog(sh, wallIdx, newLen, defaultMode) {
  const opp = findOpposingWall(sh, wallIdx);
  const oppLen = opp !== null ? wallLength(sh, opp) : null;
  const modal = createModal();
  modal.innerHTML = `
    <div class="modal">
      <h3>Change wall length to ${formatLength(newLen)}?</h3>
      <p style="font-size:13px;color:#555;">Pick how adjacent walls should adapt:</p>
      <div class="radio-group">
        <label><input type="radio" name="lemode" value="stretch-end" ${defaultMode==='stretch-end'?'checked':''}>
          <b>Move end vertex only</b><br><span style="font-size:11px;color:#777;">Adjacent walls will change length and angle. Simplest.</span></label>
        <label><input type="radio" name="lemode" value="stretch-symmetric" ${defaultMode==='stretch-symmetric'?'checked':''}>
          <b>Symmetric stretch</b><br><span style="font-size:11px;color:#777;">Wall center stays put; both endpoints move equally.</span></label>
        <label><input type="radio" name="lemode" value="maintain-rect" ${defaultMode==='maintain-rect'?'checked':''} ${opp===null?'disabled':''}>
          <b>Maintain rectangle</b><br><span style="font-size:11px;color:#777;">${opp===null?'No opposing parallel wall found.':`Also extends opposite wall (currently ${formatLength(oppLen)}). Keeps the shape rectilinear.`}</span></label>
      </div>
      <label style="font-size:11px;color:#888;"><input type="checkbox" id="le-dontask"> Don't ask next time (use default from Settings)</label>
      <div class="modal-buttons">
        <button onclick="closeModal()">Cancel</button>
        <button class="primary" onclick="confirmLengthEdit(${sh.id}, ${wallIdx}, ${newLen})">Apply</button>
      </div>
    </div>
  `;
}

function confirmLengthEdit(shapeId, wallIdx, newLen) {
  const sh = state.shapes.find(s => s.id === shapeId);
  const mode = document.querySelector('input[name="lemode"]:checked').value;
  const dontAsk = document.getElementById('le-dontask').checked;

    state.settings.askOnLengthEdit = false;

}
