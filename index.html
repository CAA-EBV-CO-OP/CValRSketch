// ----- Move a whole shape ----------------------------------------------------
// Points move; segments carry only dx/dy so nothing to rebuild; label nudges are
// relative to the geometry and travel with it.
function translateShape(sh, dx, dy) {
  pushUndo();
  sh.points = sh.points.map(p => ({ x: p.x + dx, y: p.y + dy }));
}
function moveSelectedShapeByOffset() {
  const sel = state.selection;
  if (!sel || sel.kind !== 'shape') return;
  const sh = state.shapes.find(s => s.id === sel.shapeId);
  if (!sh) return;
  const input = document.getElementById('move-offset');
  if (!input) return;
  const raw = input.value.trim();
  if (!raw) { alert("Enter an offset like 3' r or 2'6 d 1' l"); return; }
  let seg;
  try { seg = parseSegment(raw); } catch (err) { alert(err.message); return; }
  if (seg.autoExtend) { alert("Provide a length and direction (e.g. 3' r)."); return; }
  translateShape(sh, seg.dx, seg.dy);
  render();
}
// Move by picking: first click = anchor vertex on the shape being moved, second
// click = destination (any vertex on any floor — ghosts are clickable while picking —
// or a blank spot on the canvas). The shape translates so the anchor lands there.
function startShapeMovePick() {
  const sel = state.selection;
  if (!sel || sel.kind !== 'shape') return;
  state.shapeMovePick = { shapeId: sel.shapeId, anchor: null };
  render();
}
function cancelShapeMovePick() { state.shapeMovePick = null; render(); }
function handleShapeMovePick(sh, i) {
  const mp = state.shapeMovePick;
  if (!mp) return;
  if (!mp.anchor) {
    if (sh.id !== mp.shapeId) { alert('Pick the anchor on the shape you are moving first.'); return; }
    mp.anchor = { x: sh.points[i].x, y: sh.points[i].y };
    render();
    return;
  }
  finishShapeMove(sh.points[i]);
}
function finishShapeMove(dest) {
  const mp = state.shapeMovePick;
  if (!mp || !mp.anchor) return;
  const sh = state.shapes.find(s => s.id === mp.shapeId);
  if (sh) translateShape(sh, dest.x - mp.anchor.x, dest.y - mp.anchor.y);
  state.shapeMovePick = null;
  render();
}

function copySelectedShape() {
  const sel = state.selection;
  if (!sel || sel.kind !== 'shape') return;
  const sh = state.shapes.find(s => s.id === sel.shapeId);
  if (!sh) return;
  const input = document.getElementById('copy-offset');
  if (!input) return;
  const raw = input.value.trim();
  if (!raw) { alert('Enter an offset like 10\' r or 5\'d 3\'l'); return; }
  let seg;
  try { seg = parseSegment(raw); } catch (err) { alert(err.message); return; }
  if (seg.autoExtend) { alert('Provide a length and direction (e.g. 10\' r).'); return; }
  pushUndo();
  const newId = state.nextShapeId++;
  const newShape = {
    id: newId,
    label: `${sh.label} (copy)`,
    type: sh.type,
    floor: sh.floor,
    building: sh.building || DEFAULT_BUILDING,
    points: sh.points.map(p => ({ x: p.x + seg.dx, y: p.y + seg.dy })),
    segments: sh.segments.map(s => ({ ...s })),
  };
  state.shapes.push(newShape);
  state.selection = { kind: 'shape', shapeId: newId };
  input.value = '';
  render();
}

function deleteSelectedShape() {
  const sel = state.selection;
  if (!sel) return;
  if (state.settings.confirmDelete && !confirm('Delete entire shape?')) return;
  pushUndo();
  state.shapes = state.shapes.filter(s => s.id !== sel.shapeId);
  state.selection = null;
  render();
}

function deleteShapeById(id) {
  if (state.settings.confirmDelete && !confirm('Delete entire shape?')) return;
  pushUndo();
  state.shapes = state.shapes.filter(s => s.id !== id);
  if (state.selection && state.selection.shapeId === id) state.selection = null;
  render();
}

// =============================================================================
// SPLIT MODE
// =============================================================================
function splitProject() {
  const input = document.getElementById('split-dir');
  if (!input) return;
  const raw = input.value.trim().toLowerCase();
  if (!raw) return;
  if (!(raw in DIR_BASE)) { alert('Direction must be r, l, u, or d.'); return; }
  if (!state.splitSelection) { alert('Click the first vertex before projecting.'); return; }
  const sh = state.shapes.find(s => s.id === state.splitSelection.shapeId);
  if (!sh) return;
  const origin = sh.points[state.splitSelection.idx];
  const hit = rayHitsWall(origin, raw, sh, state.splitSelection.idx);
  if (!hit) { alert(`No wall hit by ray in direction "${raw}".`); return; }
  state.splitPreview = { shapeId: sh.id, originIdx: state.splitSelection.idx, dir: raw, hit };
  input.value = '';
  render();
}

function confirmSplitProject() {
  const sp = state.splitPreview;
  if (!sp) return;
  const sh = state.shapes.find(s => s.id === sp.shapeId);
  if (!sh) return;
  pushUndo();
  // Insert a new vertex on the hit wall (between points[wallIdx] and points[wallIdx+1]).
  const wallIdx = sp.hit.wallIdx;
  sh.points.splice(wallIdx + 1, 0, { x: sp.hit.point.x, y: sp.hit.point.y });
  rebuildSegments(sh);
  // Origin index may have shifted if it was after the inserted vertex.
  let originIdx = sp.originIdx;
  if (originIdx > wallIdx) originIdx += 1;
  const newVertexIdx = wallIdx + 1;
  const result = splitPolygon(sh, originIdx, newVertexIdx);
  if (!result) {
    // Revert insert + undo
    sh.points.splice(wallIdx + 1, 1);
    rebuildSegments(sh);
    state.undoStack.pop();
    state.splitPreview = null;
    render();
    return;
  }
  const i = state.shapes.indexOf(sh);
  state.shapes.splice(i, 1, result.a, result.b);
  state.splitSelection = null;
  state.splitPreview = null;
  state.mode = 'edit';
  state.selection = { kind: 'shape', shapeId: result.a.id };
  render();
}

function cancelSplitProject() {
  state.splitPreview = null;
  render();
}

function handleSplitClick(shapeId, vIdx) {
  if (!state.splitSelection) {
    state.splitSelection = { shapeId, idx: vIdx };
    render();
    return;
  }
  if (state.splitSelection.shapeId !== shapeId) {
    alert('Both vertices must be in the same shape.');
    return;
  }
  const idx1 = state.splitSelection.idx, idx2 = vIdx;
  const sh = state.shapes.find(s => s.id === shapeId);
  const result = splitPolygon(sh, idx1, idx2);
  if (!result) { state.splitSelection = null; render(); return; }
  pushUndo();
  // Replace the original with the two new ones
  const i = state.shapes.indexOf(sh);
  state.shapes.splice(i, 1, result.a, result.b);
  state.splitSelection = null;
  state.mode = 'edit';
  state.selection = { kind:'shape', shapeId: result.a.id };
  render();
}

// =============================================================================
// WALK MODE COMMANDS
// =============================================================================
function addCmd() {
  const input = document.getElementById('cmd');
  if (!input) return;
  const raw = input.value.trim();

  // Empty input + active preview → commit it
  if (!raw) {
    if (state.preview) commitWalkPreview();
    return;
  }

  const parts = raw.split(',').map(p => p.trim()).filter(Boolean);
  try {
    // Special case: a single bare direction → enter/advance preview mode
    const firstProbe = parseSegment(parts[0]);
    if (parts.length === 1 && firstProbe.autoExtend) {
      handleAutoExtendKey(firstProbe.dir);
      input.value = '';
      input.focus();
      return;
    }

    // Any other input — resolve a pending preview first. A preview the user is
    // actively cycling gets committed (don't lose it); an auto-armed step
    // suggestion gets discarded so explicit input doesn't inject a phantom wall.
    if (state.preview) {
      if (state.preview.armed) state.preview = null;
      else commitWalkPreview(/*silent=*/true);
    }

    let priorHeading = state.segments.length > 0
      ? headingDeg(state.segments[state.segments.length - 1])
      : null;
    const resolved = [];
    for (const part of parts) {
      const p = parseSegment(part, priorHeading);
      let seg;
      if (p.autoExtend) {
        const cands = findAlignedCandidatesHere([...state.segments, ...resolved], p.dir);
        if (!cands.length) throw new Error(`No vertex aligned to "${p.dir}" of the current pen position.`);
        seg = cands[0].segment;
      } else {
        seg = p;
      }
      resolved.push(seg);
      priorHeading = headingDeg(seg);
    }
    pushUndo();
    state.segments.push(...resolved);
    input.value = '';
    render();
    const cmdEl = document.getElementById('cmd');
    if (cmdEl) { cmdEl.focus(); }
  } catch (err) { alert(err.message); }
}

function handleAutoExtendKey(dir, asJump = false) {
  // Cycle if we already have a preview in same direction AND same mode (jump vs extend)
  if (state.preview && state.preview.dir === dir && !!state.preview.jump === asJump) {
    state.preview.candIdx = (state.preview.candIdx + 1) % state.preview.candidates.length;
    state.preview.armed = false;   // user is now actively choosing this preview
    render();
    return;
  }
  // New preview (possibly switching direction or mode)
  const cands = findAlignedCandidatesHere(state.segments, dir);
  if (!cands.length) { alert(`No vertex aligned to "${dir}" of the current pen position.`); return; }
  state.preview = { dir, candIdx: 0, candidates: cands, jump: asJump };
  render();
}

// Click-to-snap: draw one straight segment from the pen to a clicked point
// (any shape vertex or walk vertex). Works regardless of alignment — the fix
// for closing angled walks where keyboard r/u snapping has nothing to grab.
function snapWalkToPoint(target) {
  if (state.mode !== 'walk' || state.segments.length === 0) return;
  const wpts = pathPointsHere(state.segments);
  const pen = wpts[wpts.length - 1];
  const dx = target.x - pen.x, dy = target.y - pen.y;
  const length = Math.hypot(dx, dy);
  if (length < 1e-6) return; // pen already there
  const dir = Math.abs(dx) >= Math.abs(dy) ? (dx >= 0 ? 'r' : 'l') : (dy >= 0 ? 'd' : 'u');
  pushUndo();
  state.preview = null;
  state.segments.push({ length, dir, angle: 0, dx, dy, raw: `${formatLength(length)} ${dir} (to point)` });
  render();
}

function commitWalkPreview(silent) {
  if (!state.preview) return;
  const { dir, jump } = state.preview;
  const cand = state.preview.candidates[state.preview.candIdx];
  pushUndo();
  if (jump) {
    state.segments.push({
      ...cand.segment,
      jump: true,
      raw: `↷ ${formatLength(cand.along)} ${dir} (jump)`
    });
  } else {
    state.segments.push(cand.segment);
  }
  state.preview = null;
  // Step-mode chaining: an explicit (non-silent) commit immediately re-arms the
  // next aligned snap in the SAME direction/mode from the new pen, so you can walk
  // successive alignments with r⏎ … ⏎ ⏎ (then u⏎ ⏎) without retyping the direction.
  // A silent pre-commit (made before processing other input) does not re-arm.
  if (!silent) {
    const next = findAlignedCandidatesHere(state.segments, dir);
    if (next.length) state.preview = { dir, candIdx: 0, candidates: next, jump, armed: true };
    render();
  }
}

function cancelWalkPreview() {
  if (!state.preview) return;
  state.preview = null;
  render();
}

// ----- Re-walk a wall -------------------------------------------------------
// Removes the selected wall and turns the shape back into an in-progress walk:
// start = the wall's end vertex, segments = every other wall in ring order, so the
// pen sits at the wall's start vertex. The user types the replacement legs and
// presses Close Shape, which re-applies the original label/type/floor/building/style.
function rewalkSelectedWall() {
  const sel = state.selection;
  if (!sel || sel.kind !== 'wall') return;
  const sh = state.shapes.find(s => s.id === sel.shapeId);
  if (!sh) return;
  if (state.segments.length && !confirm('A walk is already in progress. Discard it and re-walk this wall?')) return;
  pushUndo();
  const n = sh.points.length - 1;   // closed ring: last point repeats the first
  const i = sel.idx;                // wall i runs points[i] -> points[i+1]
  const order = [];
  for (let k = 1; k <= n; k++) order.push(sh.points[(i + k) % n]);   // end vertex ... around ... start vertex
  const segs = [];
  for (let k = 0; k < order.length - 1; k++) segs.push(segmentBetween(order[k], order[k+1]));
  state.rewalk = { original: JSON.parse(JSON.stringify(sh)) };
  state.shapes = state.shapes.filter(s => s.id !== sh.id);
  state.startPoint = { x: order[0].x, y: order[0].y };
  state.segments = segs;
  state.preview = null;
  state.selection = null;
  state.activeFloor = sh.floor;
  state.mode = 'walk';
  render();
  const inp = document.getElementById('cmd'); if (inp) inp.focus();
}

function cancelShape() {
  if (state.segments.length === 0 && !state.preview) return;
  if (state.rewalk) {
    if (!confirm('Cancel the re-walk and put the original shape back?')) return;
    pushUndo();
    state.shapes.push(state.rewalk.original);
    state.rewalk = null;
    state.segments = [];
    state.preview = null;
    state.startPoint = null;
    render();
    return;
  }
  if (state.segments.length && !confirm('Discard current segments?')) return;
  pushUndo();
  state.segments = [];
  state.preview = null;
  render();
}

// Extract walls (non-jump segments) with their absolute endpoints by walking the chain.
function extractWalls(segments) {
  const start = getStart();
  let x = start.x, y = start.y;
  const walls = [];
  for (const s of segments) {
    const sx = x, sy = y;
    x += s.dx; y += s.dy;
    if (!s.jump) walls.push({ a: { x: sx, y: sy }, b: { x, y } });
  }
  return walls;
}

// Given walls (each {a, b}), assemble an ordered polygon vertex list by traversing
// the wall graph. Returns null if walls don't form a cycle or path with 0/2 endpoints.
function assemblePolygonFromWalls(walls) {
  if (walls.length < 3) return null;
  const eps = 0.05;
  const sameP = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y) < eps;
  const verts = [];
  function vId(p) {
    for (let i = 0; i < verts.length; i++) if (sameP(verts[i], p)) return i;
    verts.push({ x: p.x, y: p.y });
    return verts.length - 1;
  }
  const adj = []; // adj[id] = [{wallIdx, otherId}]
  for (let i = 0; i < walls.length; i++) {
    const aId = vId(walls[i].a), bId = vId(walls[i].b);
    if (aId === bId) continue;
    if (!adj[aId]) adj[aId] = [];
    if (!adj[bId]) adj[bId] = [];
    adj[aId].push({ wallIdx: i, otherId: bId });
    adj[bId].push({ wallIdx: i, otherId: aId });
  }
  for (let i = 0; i < verts.length; i++) if (!adj[i]) adj[i] = [];
  const ones = [], odd = [];
  for (let i = 0; i < verts.length; i++) {
    const d = adj[i].length;
    if (d === 1) ones.push(i);
    else if (d % 2 === 1 || d === 0) odd.push(i);
  }
  let startId;
  if (ones.length === 0 && odd.length === 0) startId = 0;          // closed cycle
  else if (ones.length === 2 && odd.length === 0) startId = ones[0]; // open path with 2 endpoints
  else return null;
  const used = new Set();
  const path = [startId];
  let cur = startId;
  while (used.size < walls.length) {
    const next = adj[cur].find(a => !used.has(a.wallIdx));
    if (!next) break;
    used.add(next.wallIdx);
    path.push(next.otherId);
    cur = next.otherId;
  }
  if (used.size !== walls.length) return null;
  return path.map(id => ({ x: verts[id].x, y: verts[id].y }));
}

function closeShape() {
  if (state.segments.length < 3) { alert('Need at least 3 segments.'); return; }
  const hasJumps = state.segments.some(s => s.jump);
  let pointsToUse;
  if (hasJumps) {
    const walls = extractWalls(state.segments);
    if (walls.length < 3) { alert('Need at least 3 wall segments (jumps don’t count).'); return; }
    const polygon = assemblePolygonFromWalls(walls);
    if (!polygon) {
      alert('Cannot auto-close: the walls (excluding jumps) don’t form a closed cycle or a simple open path. Either walk the missing wall, or remove jump segments from the list.');
      return;
    }
    pointsToUse = [...polygon];
    const first = pointsToUse[0], last = pointsToUse[pointsToUse.length - 1];
    const gap = Math.hypot(last.x - first.x, last.y - first.y);
    if (gap > 0.01) {
      if (gap > state.settings.autoCloseFeet) {
        if (!confirm(`Walls don’t fully close (gap ${formatLength(gap)}). Force-close with straight line?`)) return;
      }
      pointsToUse.push({ ...first });
    }
  } else {
    const pts = pathPointsHere(state.segments);
    const start = pts[0];
    const last = pts[pts.length-1];
    const gap = Math.hypot(last.x - start.x, last.y - start.y);
    if (gap > state.settings.autoCloseFeet) {
      if (!confirm(`Shape doesn’t close (gap ${formatLength(gap)}). Force-close with straight line back to start?`)) return;
      pointsToUse = [...pts, { ...start }];
    } else {
      pointsToUse = pts.map((p,i) => i === pts.length-1 ? { ...start } : p);
    }
  }
  let shape;
  if (state.rewalk) {
    // Re-walk: the shape keeps everything but its geometry. Per-wall label nudges
    // are indexed by wall and no longer line up, so they're dropped.
    pushUndo();
    const o = state.rewalk.original;
    shape = { ...o, points: pointsToUse, segments: hasJumps ? [] : [...state.segments] };
    delete shape.dimOffsets;
    state.rewalk = null;
  } else {
    const label = prompt('Label for this area:', `Area ${state.nextShapeId}`);
    if (label === null) return;
    const typeRaw = prompt(`Type? (${Object.keys(TYPES).join(', ')})`, 'living');
    if (typeRaw === null) return; // Cancel/Escape only — keep the walk intact
    const typeKey = typeRaw.trim().toLowerCase();
    // Forgiving match: a typo or wrong case must not discard the walk. Fall back to
    // 'misc' and let the user fix the type in Edit mode rather than losing their work.
    const finalType = (typeKey in TYPES) ? typeKey : 'misc';
    if (!(typeKey in TYPES)) alert(`Unrecognized type "${typeRaw.trim()}" — using "Misc / other". You can change it anytime in Edit mode.`);
    pushUndo();
    shape = {
      id: state.nextShapeId++,
      points: pointsToUse,
      segments: hasJumps ? [] : [...state.segments],
      label, type: finalType, floor: state.activeFloor, building: DEFAULT_BUILDING,
    };
  }
  if (hasJumps) rebuildSegments(shape);
  state.shapes.push(shape);
  state.segments = [];
  state.startPoint = null;
  render();
}

svg.addEventListener('click', (e) => {
  if (e.target !== svg) return;
  if (state.mode === 'text') {
    // Blank-canvas click in Text mode: place a new label here. If one is
    // selected, a blank click deselects instead of immediately adding another.
    if (state.selectedLabel !== null) { state.selectedLabel = null; render(); return; }
    addLabelAt(screenToWorld(e.clientX, e.clientY));
    return;
  }
  if (state.mode === 'walk' && state.segments.length === 0) {
    // Blank-canvas click in Walk mode drops the start point here; Shift+Arrow then
    // steps it onto aligned active-floor vertices.
    setStartPoint(screenToWorld(e.clientX, e.clientY));
    return;
  }
  if (state.shapeMovePick) {
    // Blank spot as the move destination; before the anchor is picked, ignore it.
    if (state.shapeMovePick.anchor) finishShapeMove(screenToWorld(e.clientX, e.clientY));
    return;
  }
  // Edit mode: a blank click keeps the current selection (the panel stays put);
  // Esc, or clicking another wall/vertex/shape, changes it.
  if (state.mode === 'edit') return;
  state.selection = null;
  render();
});

      }).join('')}
    </div>
    <div id="prev-area" style="background:#e9edf1; padding:14px; display:flex; justify-content:center; align-items:flex-start; max-height:60vh; overflow:auto; border:1px solid #ccc; border-radius:4px; min-height:200px;"></div>
    <div class="modal-buttons">
      <button onclick="closeModal()">Cancel</button>
      <button id="prev-save-svg">Save SVG</button>
      <button class="primary" id="prev-save-png">Save PNG</button>
    </div>`;
  m.appendChild(div);
  const sel = div.querySelector('#prev-page-size');
  sel.value = s.exportPageSize || 'auto';
  const laySel = div.querySelector('#prev-layout');
  laySel.value = s.exportLayout || 'active';
  const draw = () => {
    s.exportPageSize = sel.value;
    s.exportLayout = laySel.value;
    // Multi-floor layouts draw every floor with its own dims, so the surfacing row is moot.
    div.querySelector('#prev-dimrow').style.display = s.exportLayout === 'active' ? '' : 'none';
    s.exportIncludeTitle = div.querySelector('#prev-title').checked;
    s.exportIncludeLegend = div.querySelector('#prev-legend').checked;
    s.ghostDimFloors = [...div.querySelectorAll('[data-dimfloor]')]
      .filter(cb => cb.checked && !cb.disabled).map(cb => cb.dataset.dimfloor);
    saveSettings();
    render();  // refresh the live canvas so the clone reflects the dimension-floor choices
    const area = div.querySelector('#prev-area');
    area.innerHTML = '';
    let svgEl;
    try { svgEl = svgForExport(); } catch (e) { area.textContent = 'Preview error: ' + e.message; return; }
    const w = parseFloat(svgEl.getAttribute('width')), h = parseFloat(svgEl.getAttribute('height'));
    const scale = Math.min(680 / w, (window.innerHeight * 0.55) / h, 1);
    svgEl.setAttribute('width', Math.round(w * scale));
    svgEl.setAttribute('height', Math.round(h * scale));
    svgEl.style.boxShadow = '0 2px 8px rgba(0,0,0,0.25)';
    area.appendChild(svgEl);
  };
  sel.addEventListener('change', draw);
  laySel.addEventListener('change', draw);
  div.querySelector('#prev-title').addEventListener('change', draw);
  div.querySelector('#prev-legend').addEventListener('change', draw);
  div.querySelectorAll('[data-dimfloor]').forEach(cb => cb.addEventListener('change', draw));
  div.querySelector('#prev-save-svg').addEventListener('click', () => { exportSVG(); closeModal(); });
  div.querySelector('#prev-save-png').addEventListener('click', () => { exportPNG(); closeModal(); });
  draw();
}

async function exportSVG() {
  const clone = svgForExport();
  const xml = new XMLSerializer().serializeToString(clone);
  await saveBlob(new Blob(['<?xml version="1.0"?>\n', xml], { type: 'image/svg+xml' }), exportFilename('svg'), 'image/svg+xml');
}
function exportPNG() {
  const clone = svgForExport();
  const w = parseFloat(clone.getAttribute('width')), h = parseFloat(clone.getAttribute('height'));
  const xml = new XMLSerializer().serializeToString(clone);
  const url = URL.createObjectURL(new Blob([xml], { type:'image/svg+xml;charset=utf-8' }));
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = w*2; c.height = h*2;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(img,0,0,c.width,c.height);
    c.toBlob(async b => { await saveBlob(b, exportFilename('png'), 'image/png'); });
    URL.revokeObjectURL(url);
  };
  img.src = url;
}

// Snapshot the live canvas for export: the tight bbox of what's actually drawn
// (screen px, including rendered text extents) plus a stripped clone of the content.
// Captures whatever floor is on the canvas right now.
function captureLivePanel() {
  const allWorldPts = [];
  const sceneShapes = state.settings.showFloorGhosts ? state.shapes : shapesOnFloor(state.activeFloor);
  sceneShapes.forEach(sh => allWorldPts.push(...sh.points));
  if (state.segments.length) allWorldPts.push(...pathPointsHere(state.segments));
  state.annotations.forEach(a => { allWorldPts.push(a.a); allWorldPts.push(a.b); });
  labelsOnFloor(state.activeFloor).forEach(l => allWorldPts.push({ x: l.x, y: l.y }));

  let tight;
  if (allWorldPts.length === 0 || !viewTransform) {
    tight = { x: 0, y: 0, w: svg.clientWidth, h: svg.clientHeight };
  } else {
    const sxs = allWorldPts.map(p => viewTransform.tx + p.x * viewTransform.scale);
    const sys = allWorldPts.map(p => viewTransform.ty + p.y * viewTransform.scale);
    let sMinX = Math.min(...sxs), sMaxX = Math.max(...sxs);
    let sMinY = Math.min(...sys), sMaxY = Math.max(...sys);
    // Union in the ACTUAL rendered text (dimension labels, area labels, multi-line
    // notes) so nothing clips and we can crop tightly — which scales the drawing up.
    [...svg.querySelectorAll('text')].forEach(t => {
      if (t.classList.contains('ui-overlay')) return;
      try {
        const bb = t.getBBox();
        if (!bb || (bb.width === 0 && bb.height === 0)) return;
        sMinX = Math.min(sMinX, bb.x); sMaxX = Math.max(sMaxX, bb.x + bb.width);
        sMinY = Math.min(sMinY, bb.y); sMaxY = Math.max(sMaxY, bb.y + bb.height);
      } catch (e) { /* getBBox can throw on unrendered nodes */ }
    });
    const labelPad = 12; // text extents already counted; just a little breathing room
    tight = {
      x: sMinX - labelPad,
      y: sMinY - labelPad,
      w: (sMaxX - sMinX) + labelPad * 2,
      h: (sMaxY - sMinY) + labelPad * 2,
    };
  }

  const patterns = [...svg.querySelectorAll('defs pattern')].map(n => n.cloneNode(true));  // fills this panel references
  const content = svg.cloneNode(true);
  // Strip UI-only elements that shouldn't appear in exports
  ['.hit-wall', '.hit-vertex', '.visible-vertex', '.ui-overlay'].forEach(sel => {
    [...content.querySelectorAll(sel)].forEach(n => n.remove());
  });
  // Clear "selected" styling on walls so exports don't show blue highlights
  [...content.querySelectorAll('.visible-wall.selected')].forEach(n => n.classList.remove('selected'));
  // Drop the defs (the outer export SVG carries its own copy)
  const cloneDefs = content.querySelector('defs');
  if (cloneDefs) cloneDefs.remove();
  return { tight, content, patterns };
}

// Temporarily draw `floor` alone (ghosts off, no in-progress walk or start marker),
// run fn() against that canvas, then put the live view back exactly as it was.
function withFloorRendered(floor, fn) {
  const saved = {
    activeFloor: state.activeFloor, segments: state.segments, preview: state.preview,
    startPoint: state.startPoint, ghosts: state.settings.showFloorGhosts,
  };
  state.activeFloor = floor;
  state.segments = []; state.preview = null; state.startPoint = null;
  state.settings.showFloorGhosts = false;
  try {
    render();
    return fn();
  } finally {
    state.activeFloor = saved.activeFloor;
    state.segments = saved.segments; state.preview = saved.preview; state.startPoint = saved.startPoint;
    state.settings.showFloorGhosts = saved.ghosts;
    render();
  }
}

const FLOOR_CAPTIONS = { basement: 'Basement', main: 'Main floor', upper: 'Upper floor', other: 'Other' };
function floorCaption(f) { return FLOOR_CAPTIONS[f] || (f.charAt(0).toUpperCase() + f.slice(1)); }

function svgForExport() {
  const ns = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs, text) => {
    const el = document.createElementNS(ns, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    if (text !== undefined) el.textContent = text;
    return el;
  };

  // ---- 1. Decide what's on the export ----
  const includeTitle = state.settings.exportIncludeTitle && (state.subject || '').trim().length > 0;
  const usedTypes = [...new Set(state.shapes.map(s => s.type))].filter(k => k in TYPES);
  const includeLegend = state.settings.exportIncludeLegend && usedTypes.length > 0;

  // Above/below-grade summary line shown on the sheet (appraisal totals)
  const gradeSummary = (() => {
    let agla = 0, bArea = 0, bFin = 0, hasB = false;
    buildingsPresent().forEach(b => {
      agla += aboveGradeLiving(b);
      const bm = state.basements[b];
      if (bm) { hasB = true; const a = basementArea(b); bArea += a; bFin += a * bm.pctFinished / 100; }
    });
    const parts = [];
    if (agla > 0) parts.push(`Above-Grade Living ${Math.round(agla)} sq ft`);
    if (hasB) parts.push(`Basement ${Math.round(bArea)} sq ft (${Math.round(bFin)} finished / ${Math.round(bArea - bFin)} unfinished)`);
    return parts.join('      •      ');
  })();

  // Title + legend layout in PAGE coords (slimmed so the drawing gets more room).
  const titleH = includeTitle ? 48 : 0;
  const legendRowH = 20;
  const legendFooterH = 24;
  const legendPad = 10;
  const legendHeaderH = 20;
  const summaryRowH = (gradeSummary && includeLegend) ? 18 : 0;  // grade/basement totals live in the legend
  const legendH = includeLegend ? (legendPad*2 + legendHeaderH + usedTypes.length * legendRowH + summaryRowH + legendFooterH) : 0;

  // ---- 2. Capture the drawing panel(s) ----
  // 'active' exports the live canvas as-is (active floor + ghosts + surfaced dims).
  // 'horizontal' / 'vertical' re-render each floor on its own with ghosts off and
  // tile the panels on one sheet, so the floors read as separate plans, not a stack.
  const layout = state.settings.exportLayout || 'active';
  const floorsWithContent = state.floors.filter(f => shapesOnFloor(f).length || labelsOnFloor(f).length);
  const multi = layout !== 'active' && floorsWithContent.length > 1;
  let panels;
  if (!multi) {
    panels = [{ floor: state.activeFloor, ...captureLivePanel() }];
  } else {
    // Report order: above-grade floors as listed, basement last.
    const order = floorsWithContent.filter(f => f !== 'basement').concat(floorsWithContent.filter(f => f === 'basement'));
    panels = order.map(f => ({ floor: f, ...withFloorRendered(f, captureLivePanel) }));
  }
  const horiz = !multi || layout === 'horizontal';
  const n = panels.length;
  const captionH = multi ? 22 : 0;   // page px, under each panel
  const gap = 28;                    // page px, between panels
  const sumW = panels.reduce((a, p) => a + p.tight.w, 0), sumH = panels.reduce((a, p) => a + p.tight.h, 0);
  const maxW = Math.max(...panels.map(p => p.tight.w)), maxH = Math.max(...panels.map(p => p.tight.h));
  // Drawing extent (screen px, scales with fitScale) vs fixed page chrome (gaps, captions)
  const contentW = horiz ? sumW : maxW;
  const contentH = horiz ? maxH : sumH;
  const fixedW = horiz ? gap * (n - 1) : 0;
  const fixedH = horiz ? captionH : captionH * n + gap * (n - 1);

  // ---- 3. Page size & available canvas area ----
  const page = EXPORT_PAGE_SIZES[state.settings.exportPageSize] || null;
  const sideMargin = 24;
  let pageW, pageH;
  if (page) {
    pageW = page.w;
    pageH = page.h;
  } else {
    // Auto: page width = content width + margins; height fits content + title + legend
    pageW = Math.max(640, contentW + fixedW + sideMargin * 2);
    pageH = titleH + sideMargin + contentH + fixedH + sideMargin + legendH;
  }

  const canvasAvailW = pageW - sideMargin * 2;
  const canvasAvailH = pageH - titleH - legendH - sideMargin * 2;
  const fitScale = Math.min((canvasAvailW - fixedW) / contentW, (canvasAvailH - fixedH) / contentH);
  const blockW = contentW * fitScale + fixedW;
  const blockH = contentH * fitScale + fixedH;
  const blockX = sideMargin + (canvasAvailW - blockW) / 2;
  const blockY = titleH + sideMargin + (canvasAvailH - blockH) / 2;

  // ---- 4. Build the export SVG: page-coord outer, nested SVG for the canvas ----
  usedTypes.forEach(k => fillFor(typeStyle(k)));   // legend swatch patterns must exist before <defs> is cloned
  const liveDefs = svg.querySelector('defs');
  const out = document.createElementNS(ns, 'svg');
  out.setAttribute('xmlns', ns);
  out.setAttribute('width', pageW);
  out.setAttribute('height', pageH);
  out.setAttribute('viewBox', `0 0 ${pageW} ${pageH}`);

  if (liveDefs) {
    const defs = liveDefs.cloneNode(true);
    // Multi-floor layouts: each panel was rendered separately, so gather every
    // pattern any panel used (the live <defs> only holds the last render's).
    panels.forEach(p => (p.patterns || []).forEach(pat => { if (!defs.querySelector('#' + pat.id)) defs.appendChild(pat); }));
    out.appendChild(defs);
  }

  // Page background
  out.appendChild(mk('rect', { width: pageW, height: pageH, fill: '#fff' }));

  // Title block in page coords (slimmed)
  if (includeTitle) {
    const subj = (state.subject || '').trim();
    const sub = (state.subtitle || '').trim();
    out.appendChild(mk('text', {
      x: pageW / 2, y: 26, 'text-anchor':'middle', 'font-family':'Arial, sans-serif',
      'font-size': 18, 'font-weight':'bold', fill:'#222'
    }, subj));
    out.appendChild(mk('text', {
      x: pageW / 2, y: 42, 'text-anchor':'middle', 'font-family':'Arial, sans-serif',
      'font-size': 11, fill:'#555'
    }, sub || 'Not to scale — dimensions as labeled'));
  }

  // ---- 5. Place the panel(s): one nested SVG per panel, cropped to its tight bbox ----
  let cx = blockX, cy = blockY;
  panels.forEach(p => {
    const fw = p.tight.w * fitScale, fh = p.tight.h * fitScale;
    let px, py;
    if (horiz) { px = cx; py = blockY + (contentH * fitScale - fh) / 2; cx += fw + gap; }
    else       { px = blockX + (blockW - fw) / 2; py = cy; cy += fh + captionH + gap; }
    const nested = mk('svg', {
      x: px, y: py, width: fw, height: fh,
      viewBox: `${p.tight.x} ${p.tight.y} ${p.tight.w} ${p.tight.h}`,
      preserveAspectRatio: 'xMidYMid meet',
    });
    while (p.content.firstChild) nested.appendChild(p.content.firstChild);
    out.appendChild(nested);
    if (multi) {
      const area = shapesOnFloor(p.floor).reduce((a, sh) => a + polygonArea(sh.points), 0);
      const capY = (horiz ? blockY + contentH * fitScale : py + fh) + 15;
      out.appendChild(mk('text', {
        x: px + fw / 2, y: capY, 'text-anchor':'middle', 'font-family':'Arial, sans-serif',
        'font-size': 12, 'font-weight':'bold', fill:'#222'
      }, `${floorCaption(p.floor)} — ${Math.round(area)} sq ft`));
    }
  });

  // ---- 6. Legend in page coords at the bottom ----
  if (includeLegend) {
    const y0 = pageH - legendH + legendPad;
    const x0 = sideMargin;
    const lw = pageW - sideMargin * 2;
    out.appendChild(mk('rect', {
      x: x0, y: y0 - legendPad, width: lw, height: legendH,
      fill: 'none', stroke: '#999', 'stroke-width': 0.75
    }));
    out.appendChild(mk('text', {
      x: x0 + 12, y: y0 + 2, 'font-family':'Arial, sans-serif',
      'font-size': 13, 'font-weight':'bold', fill:'#222'
    }, 'Legend'));
    // Two-column layout if there are many types
    const usePerColumn = usedTypes.length > 4 ? Math.ceil(usedTypes.length / 2) : usedTypes.length;
    const colW = lw / (usedTypes.length > 4 ? 2 : 1);
    usedTypes.forEach((key, i) => {
      const t = TYPES[key];
      const st = typeStyle(key);
      const col = Math.floor(i / usePerColumn);
      const rowInCol = i % usePerColumn;
      const rowX = x0 + 12 + col * colW;
      const rowY = y0 + 16 + rowInCol * legendRowH;
      const swatch = mk('rect', {
        x: rowX, y: rowY, width: 22, height: 13,
        fill: fillFor(st), stroke: 'black', 'stroke-width': 1
      });
      if (t.dashed) swatch.setAttribute('stroke-dasharray','5,3');
      out.appendChild(swatch);
      out.appendChild(mk('text', {
        x: rowX + 30, y: rowY + 11, 'font-family':'Arial, sans-serif', 'font-size': 11, fill:'#222'
      }, t.name));
      const total = state.shapes.filter(s => s.type === key).reduce((a, s) => a + polygonArea(s.points), 0);
      out.appendChild(mk('text', {
        x: rowX + colW - 20, y: rowY + 11, 'text-anchor':'end',
        'font-family':'Arial, sans-serif', 'font-size': 11, 'font-weight':'bold', fill:'#444'
      }, `${Math.round(total)} sq ft`));
    });
    // Grade/basement totals consolidated into the legend (below the type rows)
    let summaryBottom = y0 + 16 + usePerColumn * legendRowH;
    if (gradeSummary) {
      out.appendChild(mk('text', {
        x: x0 + 12, y: summaryBottom + 12, 'font-family':'Arial, sans-serif',
        'font-size': 11, 'font-weight':'bold', fill:'#2b3a4a'
      }, gradeSummary));
      summaryBottom += 18;
    }
    // Wall-style swatches as a footer row
    const footerY = summaryBottom + 6;
    out.appendChild(mk('line', {
      x1: x0 + 12, y1: footerY + 5, x2: x0 + 52, y2: footerY + 5,
      stroke:'black', 'stroke-width': 2.5
    }));
    out.appendChild(mk('text', {
      x: x0 + 58, y: footerY + 9, 'font-family':'Arial, sans-serif', 'font-size': 10, fill:'#222'
    }, 'Enclosed wall'));
    out.appendChild(mk('line', {
      x1: x0 + 190, y1: footerY + 5, x2: x0 + 230, y2: footerY + 5,
      stroke:'black', 'stroke-width': 2.5, 'stroke-dasharray':'8,5'
    }));
    out.appendChild(mk('text', {
      x: x0 + 236, y: footerY + 9, 'font-family':'Arial, sans-serif', 'font-size': 10, fill:'#222'
    }, 'Open / dashed edge'));
  }

  return out;
}

// ----- Recent projects (localStorage-backed) -----
const RECENTS_INDEX_KEY = 'cvalrsketch:recents';
const RECENT_PROJECT_PREFIX = 'cvalrsketch:project:';
const MAX_RECENTS = 12;

function getRecents() {
  try { return JSON.parse(localStorage.getItem(RECENTS_INDEX_KEY) || '[]'); }
  catch (e) { return []; }
}
function setRecents(arr) {
  try { localStorage.setItem(RECENTS_INDEX_KEY, JSON.stringify(arr)); } catch (e) {}
}
function saveToRecents() {
  const subjRaw = (state.subject || '').trim();
  const subject = subjRaw || 'Untitled';
  const key = subject.replace(/[^\w\- ]/g, '_').slice(0, 60) + '_' + Date.now();
  const data = { ...state };
  delete data.undoStack; delete data.redoStack; delete data.selection;
  delete data.fenceSelection; delete data.fenceDraw; delete data.offsetPick;
  delete data.preview; delete data.splitSelection; delete data.splitPreview;
  try { localStorage.setItem(RECENT_PROJECT_PREFIX + key, JSON.stringify(data)); }
  catch (e) { /* may be quota */ }
  const recents = getRecents();
  recents.unshift({
    key, subject,
    savedAt: new Date().toISOString(),
    shapes: state.shapes.length,
    floors: [...new Set(state.shapes.map(s => s.floor))],
  });
  while (recents.length > MAX_RECENTS) {
    const old = recents.pop();
    try { localStorage.removeItem(RECENT_PROJECT_PREFIX + old.key); } catch (e) {}
  }
  setRecents(recents);
}
function loadFromRecents(key) {
  const raw = localStorage.getItem(RECENT_PROJECT_PREFIX + key);
  if (!raw) { alert('Project not found in recents'); return; }
  if (state.shapes.length || state.segments.length) {
    if (!confirm('Discard current sketch and load this recent project?')) return;
  }
  try {
    const d = JSON.parse(raw);
    Object.assign(state, d);
    state.settings = { ...SETTINGS_DEFAULTS, ...(d.settings || {}) };
    state.undoStack = []; state.redoStack = [];
    state.selection = null; state.fenceSelection = null; state.fenceDraw = null;
    state.offsetPick = null; state.preview = null;
    state.splitSelection = null; state.splitPreview = null;
    const subjInp = document.getElementById('subject-input'); if (subjInp) subjInp.value = state.subject || '';
    dropFileHandle();   // recents are browser copies, not the file that was armed
    closeModal();
    render();
  } catch (e) { alert('Load failed: ' + e.message); }
}
function deleteFromRecents(key) {
  if (!confirm('Remove this project from recents? (Your saved file is unaffected.)')) return;
  const recents = getRecents().filter(r => r.key !== key);
  setRecents(recents);
  try { localStorage.removeItem(RECENT_PROJECT_PREFIX + key); } catch (e) {}
  openRecentsModal();
}
function formatRecentDate(iso) {
  const d = new Date(iso);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff/86400) + 'd ago';
  return d.toLocaleDateString();
}
function openRecentsModal() {
  const m = createModal();
  const recents = getRecents();
  const rows = recents.length
    ? recents.map(r => `
        <div style="display:flex; align-items:center; gap:8px; padding:8px; border:1px solid #ddd; border-radius:6px;">
          <div style="flex:1; min-width:0;">
            <div style="font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${(r.subject || 'Untitled').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}</div>
            <div style="font-size:11px; color:#666;">${r.shapes} shape${r.shapes === 1 ? '' : 's'} · ${formatRecentDate(r.savedAt)}</div>
          </div>
          <button data-recent-load="${r.key.replace(/"/g, '&quot;')}" class="primary">Load</button>
          <button data-recent-del="${r.key.replace(/"/g, '&quot;')}" class="danger">×</button>
        </div>`).join('')
    : '<div style="color:#999; padding:8px;">No recent projects yet. Save a sketch first.</div>';
  m.innerHTML = `
    <div class="modal" style="min-width:480px; max-width:560px;">
      <h3>📂 Recent projects</h3>
      <p style="font-size:12px; color:#666; margin:0 0 8px;">Stored in this browser only — independent of any files you saved.</p>
      <div style="display:flex; flex-direction:column; gap:6px; max-height:60vh; overflow-y:auto;">
        ${rows}
      </div>
      <div class="modal-buttons">
        <button onclick="closeModal()">Close</button>
      </div>
    </div>
  `;
  m.querySelectorAll('[data-recent-load]').forEach(b => b.onclick = () => loadFromRecents(b.dataset.recentLoad));
  m.querySelectorAll('[data-recent-del]').forEach(b => b.onclick = () => deleteFromRecents(b.dataset.recentDel));
}

// Save = write the current file in place (no dialog) once one is known; otherwise Save As.
async function saveJSON() {
  saveToRecents();
  if (fileAutosaveSupported && fileAutosave.handle) {
    if (fileAutosave.status === 'paused') await resumeFileAutosave();
    else await writeFileAutosave(true);
    if (fileAutosave.status === 'saved') return;
    // couldn't write the known file — fall through to Save As
  }
  await saveJSONAs();
}
async function saveJSONAs() {
  saveToRecents();
  const payload = serializeProject();
  const handle = await saveBlob(new Blob([payload], { type:'application/json' }), exportFilename('json'), 'application/json');
  if (handle) {
    setFileHandle(handle);
    fileAutosave.lastPayload = payload;
    fileAutosave.lastAt = Date.now();
    fileAutosave.status = 'saved';
    renderAutosaveChip();
  }
}

function newProject() {
  const hasWork = state.shapes.length || state.segments.length || state.annotations.length || (state.subject || '').trim();
  if (hasWork) {
    if (!confirm('Discard the current sketch and start a new project?\n\n(Use Undo / Ctrl+Z to recover if you change your mind.)')) return;
  }
  pushUndo();
  state.shapes = [];
  state.segments = [];
  state.startPoint = null;
  state.annotations = [];
  state.basements = {};
  state.labels = [];
  state.nextLabelId = 1;
  state.selectedLabel = null;
  state.labelDrag = null;
  state.shapeLabelDrag = null; state.dimLabelDrag = null; state.shapeMovePick = null;
  state.subject = '';
  state.subtitle = '';
  state.floors = ['basement', 'main', 'upper', 'other'];
  state.activeFloor = 'main';
  state.nextShapeId = 1;
  state.selection = null;
  state.splitSelection = null;
  state.preview = null;
  state.splitPreview = null;
  state.fenceSelection = null;
  state.fenceDraw = null;
  state.offsetPick = null;
  state.mode = 'walk';
  const subjInp = document.getElementById('subject-input'); if (subjInp) subjInp.value = '';
  dropFileHandle();   // a fresh project must never autosave over the previous file
  render();
}
function applyLoadedProject(text) {
  const d = JSON.parse(text);
  Object.assign(state, d);
  state.settings = { ...SETTINGS_DEFAULTS, ...(d.settings || {}) };   // older files lack newer keys
  state.selection = null; state.splitSelection = null;
  state.labels = d.labels || []; state.nextLabelId = d.nextLabelId || 1;
  state.basements = d.basements || {};
  state.selectedLabel = null; state.labelDrag = null; state.shapeLabelDrag = null; state.dimLabelDrag = null; state.shapeMovePick = null;
  const subjInp = document.getElementById('subject-input');
  if (subjInp) subjInp.value = state.subject || '';
  saveToRecents();  // also add loaded sketch to recents so it's reloadable
  render();
}
// Plain <input type=file> path (Firefox/Safari, or when the picker is unavailable): no handle, so no file autosave.
document.getElementById('load-json').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { applyLoadedProject(r.result); dropFileHandle(); }
    catch (err) { alert('Load failed: '+err.message); }
  };
  r.readAsText(f);
  e.target.value = '';
});
// Chrome/Edge: open through the file picker instead, so we get a writable handle
// and can autosave straight back to the file that was loaded.
document.getElementById('load-label').addEventListener('click', async (e) => {
  if (!fileAutosaveSupported) return;   // let the <input type=file> open as usual
  e.preventDefault();
  let handle;
  try {
    [handle] = await window.showOpenFilePicker({
      types: [{ description: 'CValRSketch JSON', accept: { 'application/json': ['.json'] } }],
      multiple: false,
    });
  } catch (err) { return; }             // cancelled
  try {
    const file = await handle.getFile();
    applyLoadedProject(await file.text());
    setFileHandle(handle);
    fileAutosave.lastPayload = serializeProject();   // file and state agree right now; write on the next change
    renderAutosaveChip();
  } catch (err) { alert('Load failed: ' + err.message); }
});

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

// Best-available "save this blob" path:
//   1) File System Access API (Chrome/Edge/Opera) — real Save As dialog with
//      folder navigation + Create New Folder. Browser remembers the last folder
//      for this app + file type, so the next save defaults there.
//   2) Web Share API with files (mobile) — share sheet incl. "Save to Files".
//   3) Fallback: direct download to the browser's default Downloads folder.
async function saveBlob(blob, filename, mime) {
  if (window.showSaveFilePicker) {
    try {
      const ext = '.' + (filename.split('.').pop() || 'bin');
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        startIn: 'documents',
        types: [{ description: ext.slice(1).toUpperCase() + ' file', accept: { [mime]: [ext] } }],
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return handle;   // callers that want to keep writing here (file autosave) get the handle
    } catch (e) { if (e && e.name === 'AbortError') return null; }
  }
  if (typeof File !== 'undefined') {
    try {
      const file = new File([blob], filename, { type: mime });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: state.subject || filename });
        return;
      }
    } catch (e) { /* fall through */ }
  }
  triggerDownload(blob, filename);
  return null;
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

window.addEventListener('resize', render);
// Touching the shape's colour/pattern controls means "own style" — untick "type default" for the user.
document.addEventListener('input', (e) => {
  if (e.target && (e.target.id === 'sh-color' || e.target.id === 'sh-pattern')) {
    const cb = document.getElementById('sh-style-default'); if (cb) cb.checked = false;
  }
});

window.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undoHistory(); }
  else if (mod && !e.shiftKey && e.key.toLowerCase() === 's') { e.preventDefault(); saveJSON(); }
  else if (mod && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) { e.preventDefault(); redoHistory(); }
  else if (e.key === 'Escape' && state.offsetPick) { cancelOffsetPick(); }
  else if (e.key === 'Escape' && state.shapeMovePick) { cancelShapeMovePick(); }
  else if (e.key === 'Escape' && state.mode === 'edit' && state.selection) { state.selection = null; render(); }
  else if (e.key === 'Escape' && state.mode === 'fence' && (state.fenceSelection || state.fenceDraw)) { state.fenceDraw = null; state.fenceSelection = null; render(); }
  else if (state.mode === 'text' && state.selectedLabel !== null && (e.key === 'Delete' || e.key === 'Backspace')) { e.preventDefault(); deleteLabel(state.selectedLabel); }
  else if (e.key === 'Escape' && state.mode === 'text' && state.selectedLabel !== null) { state.selectedLabel = null; render(); }
  else if (e.shiftKey && !mod && state.mode === 'walk' && state.segments.length === 0 && state.startPoint !== null &&
           (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault();
    if (e.key === 'ArrowLeft') stepStartAlign('x', -1);
    else if (e.key === 'ArrowRight') stepStartAlign('x', 1);
    else if (e.key === 'ArrowUp') stepStartAlign('y', -1);
    else if (e.key === 'ArrowDown') stepStartAlign('y', 1);
  }
});

autoRestoreSession();   // silently reopen the last session before the first paint
restoreFileHandle();    // pick the autosave file back up (or offer to resume it)
render();
window.addEventListener('beforeunload', writeAutosave);  // flush the debounce gap on reload/close

// Register service worker for offline PWA install. Skipped on file:// (no SW support there).
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed:', err));
  });
}
</script>
</body>
